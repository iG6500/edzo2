<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c2a3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alapozó">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}</style>
<title>Állóképesség Alapozó</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: egyoszlopos app, alsó navigációval. A nyitókép egy éjszakai folyópanel: a 6 hét kanyargó útvonalként, minden edzés egy állomás.
   Szín = mozgásforma (türkiz kerékpár, lila gyaloglás, sárga mérőpont), a szív-adatok korall színt kapnak. */
:root{
  --bg:#e9eff2; --surface:#f8fbfc; --ink:#0c2230; --muted:#557080; --line:#cfdbe2; --track:#dbe5ea;
  --accent:#0b6a86; --accent-ink:#ffffff;
  --bike:#0c7f80; --walk:#7a4ea6; --ellip:#2a63b8; --ease:#b97a0c; --soft:#557a93; --danger:#c03a3a; --heart:#d23f57;
  --night:#0c2a3b; --night-ink:#e8f3f7; --night-muted:#9dbccb; --night-line:rgba(190,225,240,.13);
  --n-bike:#5fd8cf; --n-walk:#c6aaff; --n-ellip:#8ec1ff; --n-ref:#ffcf5c;
  --f-disp:'Big Shoulders Display','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08141c; --surface:#0f202b; --ink:#e2edf2; --muted:#8ea8b6; --line:#1f3644; --track:#1c3240;
    --accent:#47c2df; --accent-ink:#04212b;
    --bike:#45cfc6; --walk:#b99af2; --ellip:#7fb0ff; --ease:#f0b34a; --soft:#8fb3cc; --danger:#ff8079; --heart:#ff6f86;
    --night:#10304a; --night-ink:#e8f3f7; --night-muted:#9dbccb; --night-line:rgba(190,225,240,.12);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08141c; --surface:#0f202b; --ink:#e2edf2; --muted:#8ea8b6; --line:#1f3644; --track:#1c3240;
  --accent:#47c2df; --accent-ink:#04212b;
  --bike:#45cfc6; --walk:#b99af2; --ellip:#7fb0ff; --ease:#f0b34a; --soft:#8fb3cc; --danger:#ff8079; --heart:#ff6f86;
  --night:#10304a; --night-ink:#e8f3f7; --night-muted:#9dbccb; --night-line:rgba(190,225,240,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:580px;margin:0 auto;padding-block:14px calc(108px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;font-weight:800;letter-spacing:.01em;line-height:1}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.p-bike{--ph:var(--bike)} .p-walk{--ph:var(--walk)} .p-ellip{--ph:var(--ellip)} .p-ease{--ph:var(--ease)} .p-soft{--ph:var(--soft)}

/* felső sáv */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--night);color:var(--n-bike);display:grid;place-items:center}
.brand .mark .ic{width:20px;height:20px;stroke-width:2.2}

/* alsó navigáció */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 88%,transparent);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabs-in{width:100%;max-width:420px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;background:none;border:0;border-radius:14px;color:var(--muted);font:600 12.5px var(--f-body);letter-spacing:.02em;cursor:pointer}
.tab .ic{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}

/* hero: éjszakai folyó */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--night);color:var(--night-ink);isolation:isolate}
.hero .contours{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .contours path{fill:none;stroke:var(--night-line);stroke-width:1.2}
.hero-in{padding:22px 20px 20px;display:flex;flex-direction:column;gap:16px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--night-muted)}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--n-bike);box-shadow:0 0 0 4px rgba(95,216,207,.18)}
.hero h1{font-size:clamp(46px,14vw,66px);font-weight:900;text-transform:uppercase;line-height:.86;letter-spacing:.005em}
.hero h1 span{display:block;color:transparent;-webkit-text-stroke:1.5px var(--night-ink)}
.route{width:100%;height:auto;display:block;overflow:visible}
.route .rail{fill:none;stroke:rgba(190,225,240,.22);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 7}
.route .trav{fill:none;stroke:var(--n-bike);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.route .wl{fill:var(--night-muted);font:700 10px var(--f-body);letter-spacing:.08em}
.route .nx{fill:none;stroke:var(--night-ink);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.route .nx{animation:none}}
.hstats{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;align-items:start}
.hstats b{font-family:var(--f-disp);font-weight:900;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums}
.hstats b small{font-size:20px;color:var(--night-muted);font-weight:700;margin-left:2px}
.hstats span{display:block;font-size:13px;color:var(--night-muted);margin-top:4px}
.hmeter{height:6px;border-radius:3px;background:rgba(190,225,240,.16);margin-top:8px;overflow:hidden}
.hmeter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--n-bike),var(--n-walk))}
.hlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--night-muted)}
.hlegend span{display:inline-flex;align-items:center;gap:6px}
.hlegend i{width:9px;height:9px;border-radius:50%}
.btn.hero-cta{background:var(--night-ink);color:var(--night);border-color:var(--night-ink);justify-content:space-between;min-height:54px;border-radius:16px;padding:0 18px}
.hero-cta .go{display:flex;align-items:center;gap:10px}
.hero-cta small{font-weight:500;opacity:.7}

/* kártyák, gombok */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:30px}
.card h3{font-size:24px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.advice{border:1.5px solid var(--ease);background:color-mix(in srgb,var(--ease) 7%,var(--surface))}
.advice .eyebrow{color:var(--ease)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--f-body);cursor:pointer;text-align:center;transition:transform .12s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns .btn{flex:1 1 140px}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

details.guide{padding:0}
details.guide summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary .ic{transition:transform .2s}
details.guide[open] summary .ic{transform:rotate(180deg)}
details.guide ul{margin:0;padding:0 18px 18px 38px;display:flex;flex-direction:column;gap:8px;font-size:15px}
details.guide li::marker{color:var(--accent)}

.meter{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--bike),var(--walk));border-radius:4px}
.wk{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.wk b{font-family:var(--f-disp);font-size:34px;line-height:1;font-weight:900}

/* hetek */
.week{position:relative;overflow:hidden}
.week.cur{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.week-head{display:flex;align-items:center;gap:14px}
.wnum{font-family:var(--f-disp);font-weight:900;font-size:76px;line-height:.75;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--ink) 35%,transparent);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
.week.cur .wnum{-webkit-text-stroke-color:var(--accent)}
.wt{display:flex;flex-direction:column;gap:4px;min-width:0}
.cnt{font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.wdots{display:flex;gap:4px;margin-top:2px}
.wdots i{width:16px;height:5px;border-radius:3px;background:var(--track)}
.wdots i.on{background:var(--ph)}
.sess{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 10px;margin-inline:-10px;border-radius:14px;border-top:1px solid var(--line)}
.sess.next{background:color-mix(in srgb,var(--accent) 8%,transparent);border-top-color:transparent}
.sess.next + .sess{border-top-color:transparent}
.mico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--ph) 13%,transparent);color:var(--ph)}
.mico .ic{width:18px;height:18px}
.mico.on{background:var(--ph);color:var(--surface)}
.sess b{display:block;font-weight:600}
.sess .meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:2px}

/* szakaszsáv és időzítő */
.segs{display:flex;gap:3px;height:10px}
.seg{border-radius:3px;background:var(--track);overflow:hidden;min-width:3px}
.seg i{display:block;height:100%;width:0;background:var(--ph)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--ph)}
.timer{display:flex;flex-direction:column;gap:14px;background:var(--surface);background:color-mix(in srgb,var(--ph) 9%,var(--surface));border-color:color-mix(in srgb,var(--ph) 35%,var(--line));transition:background .6s ease,border-color .6s ease}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--ph);color:var(--surface);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill .ic{width:17px;height:17px;stroke-width:2.1}
.dial{position:relative;width:min(76vw,300px);aspect-ratio:1;max-width:100%;margin:4px auto 0}
.dial svg{width:100%;height:100%;display:block}
.dial .dtrack{fill:none;stroke:color-mix(in srgb,var(--ph) 18%,transparent);stroke-width:14}
.dial .dprog{fill:none;stroke:var(--ph);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.dial .dtick{stroke:color-mix(in srgb,var(--ink) 25%,transparent);stroke-width:2;stroke-linecap:round}
.dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.big{font-family:var(--f-disp);font-weight:900;font-size:clamp(68px,21vw,104px);line-height:.85;letter-spacing:.01em;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink)}
.dsub{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cue{text-align:center;color:var(--ink);font-size:17px;font-weight:500;min-height:3em;max-width:34ch;margin:0 auto;text-wrap:balance}
.tmeta{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.tmeta b{color:var(--ink);font-variant-numeric:tabular-nums}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrls .span2{grid-column:1/-1}

/* visszajelzés */
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button,.opt{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--f-body);cursor:pointer}
.rpe button{font-family:var(--f-disp);font-size:22px;font-weight:800}
.rpe button.on,.opt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two-up{display:grid;grid-template-columns:1fr 1fr}
.opts.three-up{display:grid;grid-template-columns:repeat(3,1fr)}
.opts.three-up .opt{flex-direction:column;justify-content:center;text-align:center;gap:4px;font-size:14px;padding:10px 6px}
.swap .opt{font-size:14.5px}
.hero-actions{display:flex;gap:10px}
.hero-actions .hero-cta{flex:1;min-width:0}
.btn.hero-rain{flex:none;width:54px;min-height:54px;padding:0;border-radius:16px;background:transparent;color:var(--night-ink);border-color:rgba(190,225,240,.35)}
.btn.hero-rain .ic{width:24px;height:24px}
.opt{text-align:left;padding:10px 14px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl-t{font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=number],input[type=date],input[type=text],textarea{width:100%;font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
textarea{min-height:80px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:14px;color:var(--muted);min-height:1.3em}
.fbtime{font-family:var(--f-disp);font-weight:900;font-size:72px;line-height:.9;font-variant-numeric:tabular-nums}

/* napló */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum div{display:flex;flex-direction:column;gap:2px}
.sum b{font-family:var(--f-disp);font-size:32px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--muted)}
.refs{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.refs div{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.entry{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0;padding-top:0}
.ehead{display:flex;align-items:flex-start;gap:12px}
.ehead > div{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.warn{border-color:var(--danger);color:var(--danger)}
.empty{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty > .ic{width:30px;height:30px;color:var(--accent)}
.trends{display:flex;flex-direction:column}
.trend{display:flex;flex-direction:column;gap:6px;padding-block:14px;border-top:1px solid var(--line)}
.trend:first-child{border-top:0;padding-top:4px}
.trend .row{flex-wrap:wrap;gap:4px 12px}
.tv{white-space:nowrap}
.tv b{font-family:var(--f-disp);font-size:30px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
svg.ch{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
svg.ch .gl{stroke:var(--line);stroke-width:1}
svg.ch .ax{fill:var(--muted);font:11px var(--f-body);font-variant-numeric:tabular-nums}
svg.ch .ln{fill:none;stroke:var(--heart);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.ch .pt{fill:var(--heart);stroke:var(--surface);stroke-width:2}
svg.ch .hl{fill:none;stroke:var(--heart);stroke-width:1.5}
.cap{color:var(--ink)}
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
@media (max-width:360px){.sum b{font-size:26px}.two{grid-template-columns:1fr}.hstats b{font-size:34px}}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9.5 8.5H15l3.5 8M9.5 8.5l2.5 8H5.5M7.5 5.5h3M14 8.5l-.8-3H11.5"/></symbol>
  <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M9 21l2.5-6.5L14 17v4M7.5 12l2.5-4.5 3.5 1 2 3 2.5 1M11.5 14.5l1.5-6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 5v14l9-7zM18 5v14"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 3h5"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></symbol>

  <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15h10a3.5 3.5 0 0 0 .4-7A5.5 5.5 0 0 0 7 8.3 3.4 3.4 0 0 0 7 15z"/><path d="M8.5 18l-1 2.5M12.5 18l-1 2.5M16.5 18l-1 2.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark"><svg class="ic" aria-hidden="true"><use href="#i-pulse"/></svg></span>Alapozó</div>
    <button class="btn sm" id="sndBtn" data-act="snd" type="button" aria-pressed="true"></button>
  </header>

  <section class="stack" id="view-plan"></section>
  <section class="stack" id="view-run" hidden></section>
  <section class="stack" id="view-log" hidden></section>
</div>

<nav class="tabs" aria-label="Nézetek"><div class="tabs-in" role="tablist">
  <button class="tab" role="tab" data-act="tab" data-tab="plan" aria-selected="true" type="button"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg>Terv</button>

</div></nav>

<script>
(function(){
'use strict';

/* ================= tárolás ================= */
var KEY='alapozo-v2',OLDKEY='bringas-alapozo-v1';
var store={v:2,log:[],metrics:[],defer:{},route:{name:'',km:null,sport:'bike'},sound:true,hrCap:null,resets:{},dismissed:{},active:null};
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var o=JSON.parse(raw);
      if(o&&Array.isArray(o.log)){
        store.log=o.log;store.sound=o.sound!==false;store.hrCap=o.hrCap||null;
        store.resets=o.resets||{};store.dismissed=o.dismissed||{};store.active=o.active||null;
        store.metrics=Array.isArray(o.metrics)?o.metrics:[];
        if(o.route)store.route=o.route;
        store.defer=o.defer||{};
      }
      return;
    }
    var old=localStorage.getItem(OLDKEY);
    if(old){
      var p=JSON.parse(old);
      if(p&&Array.isArray(p.log)){
        store.log=p.log.map(function(x){
          return {id:x.id,date:x.date,kind:x.type==='ref'?'ref':'free',sport:'bike',sid:null,week:null,
            title:x.type==='ref'?'Referenciakör':'Kerékpár (korábbi program)',min:x.min,sec:x.refSec||null,
            full:!!x.full,rpe:x.rpe,breath:x.breath,hrAvg:x.hrAvg,hrMax:x.hrMax,km:null,note:x.note||''};
        });
        save();
      }
    }
  }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
load();

/* ================= segédek ================= */
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return (n<10?'0':'')+n;};
var mmss=function(s){s=Math.max(0,Math.round(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad(m):pad(m))+':'+pad(s%60);};
var ic=function(id){return '<svg class="ic" aria-hidden="true"><use href="#'+id+'"/></svg>';};
var fmtMin=function(m){m=Math.round(m);return m>=60?Math.floor(m/60)+' ó '+m%60+' p':m+' p';};
var km=function(v){return String(Math.round(v*100)/100).replace('.',',')+' km';};
var dayKey=function(d){d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
function fmtDate(iso){
  try{var d=new Date(iso);return d.toLocaleDateString('hu-HU',{weekday:'short',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});}
  catch(e){return String(iso).slice(0,16);}
}
function numIn(id,lo,hi,dec){
  var el=$(id);if(!el||el.value==='')return null;
  var n=dec?parseFloat(String(el.value).replace(',','.')):parseInt(el.value,10);
  return (isFinite(n)&&n>=lo&&n<=hi)?n:null;
}

/* ================= a program ================= */
var SPORT={
  bike:{name:'Kerékpár',short:'Kerékpár',icon:'i-bike',main:'Tekerés',ease:'Lassú gurulás',mainW:'tekerés',easeW:'gurulás',
    cWarm:'Lazán tekerj, a pulzusod fokozatosan emelkedjen.',cMain:'Beszélgetős tempó: egész mondatokat tudj mondani.',cEase:'Szinte csak gurulj, lélegezz mélyen.'},
  walk:{name:'Gyaloglás',short:'Gyaloglás',icon:'i-walk',main:'Tempós séta',ease:'Lassú séta',mainW:'tempós séta',easeW:'lassú séta',
    cWarm:'Kényelmes sétatempó, lazítsd a vállad.',cMain:'Szaporább lépések, lendülő kar. Még tudj beszélgetni.',cEase:'Lassíts le, lélegezz mélyen és egyenletesen.'},
  ellip:{name:'Elliptikus tréner',short:'Elliptikus',icon:'i-ellip',main:'Elliptikus',ease:'Lassú lépés',mainW:'elliptikus',easeW:'lassú lépés',
    cWarm:'Kis ellenállás, lassú, kerek mozdulatok.',cMain:'Egyenletes tempó, kis-közepes ellenállás. Tudj beszélgetni.',cEase:'Vedd le az ellenállást, szinte csak lépegess.'}
};
function phName(t,sp){if(t==='warm')return 'Bemelegítés';if(t==='cool')return 'Levezetés';return t==='main'?SPORT[sp].main:SPORT[sp].ease;}
function phCue(t,sp){
  if(t==='warm')return SPORT[sp].cWarm;
  if(t==='cool')return 'Egyre lazábban, hagyd, hogy a légzésed lecsillapodjon.';
  return t==='main'?SPORT[sp].cMain:SPORT[sp].cEase;
}
/* esőnap: ugyanaz az edzés, más mozgásformával; a tervben ugyanannak számít */
function swapAs(s,sp){var o={};for(var k in s)o[k]=s[k];o.sport=sp;o.orig=s.sport;o.title=SPORT[sp].name+' (esőnap)';return o;}
function phClass(t,sp){return (t==='warm'||t==='cool')?'soft':(t==='main'?sp:'ease');}
function phIcon(t,sp){return t==='main'?SPORT[sp].icon:(t==='ease'?SPORT[sp].icon:'i-timer');}

function mk(w,sp,title,warm,blocks,cool){
  var ph=[{t:'warm',s:warm*60}];
  blocks.forEach(function(b){ph.push({t:'main',s:b[0]*60});if(b[1])ph.push({t:'ease',s:b[1]*60});});
  ph.push({t:'cool',s:cool*60});
  var total=ph.reduce(function(a,p){return a+p.s;},0);
  return {kind:'plan',week:w,sport:sp,title:title,warm:warm,blocks:blocks,cool:cool,phases:ph,total:total};
}
var bike=function(w,warm,blocks,cool){return mk(w,'bike','Kerékpár',warm,blocks,cool);};
var longb=function(w,warm,blocks,cool){return mk(w,'bike','Hosszú kör',warm,blocks,cool);};
var walk=function(w,warm,main,cool){return mk(w,'walk','Gyaloglás',warm,[[main,0]],cool);};
var ref=function(w,title,rid){return {kind:'ref',id:rid,week:w,sport:'bike',title:title,total:0};};

var WEEKS=[
  {n:1,note:'Ismerkedés. Rövid tekerési szakaszok sok pihenővel, a gyaloglás egyben is mehet.',items:[
    ref(1,'Kiinduló mérés','ref0'),
    bike(1,3,[[5,1],[5,1],[5,1]],4), walk(1,3,14,3), bike(1,3,[[5,1],[5,1],[5,1]],4), walk(1,3,14,3), bike(1,3,[[5,1],[5,1],[5,1]],4)]},
  {n:2,note:'Hosszabb tekerési szakaszok, ugyanaz a kényelmes tempó.',items:[
    bike(2,3,[[8,1],[8,1],[6,0]],3), walk(2,4,17,4), bike(2,3,[[8,1],[8,1],[6,0]],3), walk(2,4,17,4), bike(2,3,[[8,1],[8,1],[6,0]],3)]},
  {n:3,note:'Megjelenik a hosszú kör. A hét végén félidős mérés.',items:[
    bike(3,3,[[10,1],[10,1],[7,0]],3), walk(3,5,20,5), bike(3,3,[[10,1],[10,1],[7,0]],3), walk(3,5,20,5), longb(3,3,[[12,1],[12,1],[8,0]],3),
    ref(3,'Félidős mérés','ref3')]},
  {n:4,note:'Könnyebb hét. Kevesebb idő, hogy a szervezet beépítse az eddigi munkát.',items:[
    bike(4,3,[[12,1],[11,0]],3), walk(4,5,20,5), bike(4,3,[[12,1],[11,0]],3), walk(4,5,20,5)]},
  {n:5,note:'Hosszú, egyenletes szakaszok. A tempó továbbra sem nő, csak az idő.',items:[
    bike(5,3,[[15,1],[15,1]],5), walk(5,5,25,5), bike(5,3,[[15,1],[15,1]],5), walk(5,5,25,5), longb(5,4,[[20,1],[20,0]],5)]},
  {n:6,note:'Fél óra egyhuzamban. A hét végén záró mérés ugyanazon a körön.',items:[
    bike(6,4,[[30,0]],6), walk(6,5,30,5), bike(6,4,[[30,0]],6), walk(6,5,30,5), longb(6,5,[[25,1],[25,0]],4),
    ref(6,'Záró mérés','ref6')]}
];
var ALL=[];
WEEKS.forEach(function(w){w.items.forEach(function(s,i){if(!s.id)s.id='w'+w.n+'-'+(i+1);ALL.push(s);});});
var byId=function(id){for(var i=0;i<ALL.length;i++)if(ALL[i].id===id)return ALL[i];return null;};
function routeSet(){return !!(store.route.name||store.route.km);}
function routeLabel(){var r=store.route,p=[];if(r.name)p.push(r.name);if(r.km)p.push(km(r.km));return p.join(', ');}
function refTxt(noSport){return routeSet()?'a referenciakört ('+routeLabel()+')'+(noSport?'':' '+(store.route.sport==='walk'?'gyalog':'kerékpárral'))+', kényelmes tempóban':'a választott referenciakört kényelmes tempóban';}

function describe(s){
  if(s.kind==='ref')return 'Stopperes mérés: '+refTxt()+'.';
  var parts=[],b=s.blocks,i=0,mainW=SPORT[s.sport].mainW,easeW=SPORT[s.sport].easeW;
  while(i<b.length){
    var j=i;
    while(j+1<b.length&&b[j+1][0]===b[i][0]&&b[j+1][1]===b[i][1])j++;
    var c=j-i+1,r=b[i][0],e=b[i][1];
    parts.push(e?(c>1?c+' × (':'')+r+' p '+mainW+' + '+e+' p '+easeW+(c>1?')':''):(c>1?c+' × ':'')+r+' p '+mainW);
    i=j+1;
  }
  return s.warm+' p bemelegítés · '+parts.join(' · ')+' · '+s.cool+' p levezetés';
}
function afterReset(w,date){var r=store.resets[w];return !r||date>r;}
function isDone(s){return store.log.some(function(x){return x.sid===s.id&&x.full&&afterReset(s.week,x.date);});}
function nextItem(){
  var t=dayKey(Date.now()),def=null;
  for(var i=0;i<ALL.length;i++){
    var it=ALL[i];if(isDone(it))continue;
    if(it.kind==='ref'&&store.defer[it.id]===t){if(!def)def=it;continue;}
    return it;
  }
  return def;
}
function doneSport(it){for(var i=store.log.length-1;i>=0;i--){var x=store.log[i];if(x.sid===it.id&&x.full&&afterReset(it.week,x.date))return x.sport||it.sport;}return it.sport;}
function doneCount(){return ALL.filter(isDone).length;}

/* Heti tanács: ha az előző héten sokszor elfogyott a levegő, ismétlés javasolt */
function advice(){
  var nx=nextItem();if(!nx)return null;
  var cw=nx.week,pw=cw-1;
  if(pw<1||store.dismissed[pw])return null;
  var started=WEEKS[cw-1].items.some(isDone);
  if(started)return null;
  var E=store.log.filter(function(x){return x.week===pw&&x.kind==='plan'&&afterReset(pw,x.date);});
  if(!E.length)return null;
  var hard=E.filter(function(x){return x.breath==='none';}).length;
  var R=E.filter(function(x){return x.rpe;});
  var avg=R.length?R.reduce(function(a,x){return a+x.rpe;},0)/R.length:0;
  if(hard>=2||avg>=7)return {pw:pw,hard:hard,avg:avg};
  return null;
}
function last7(){
  var lim=Date.now()-7*864e5;
  return store.log.filter(function(x){return new Date(x.date).getTime()>=lim;}).reduce(function(a,x){return a+(x.min||0);},0);
}
function trainedToday(){var t=dayKey(Date.now());return store.log.some(function(x){return dayKey(x.date)===t;});}

/* ================= edzés állapot ================= */
var run={mode:'idle',rain:false,kind:null,sel:null,session:null,sport:'bike',cum:[],total:0,base:0,resumeAt:0,paused:false,idx:-1,lastSec:-1,timer:0,fb:null,rpe:0,breath:'',fills:[]};
var elapsedMs=function(){return run.base+(run.paused?0:Date.now()-run.resumeAt);};
function persist(){
  store.active=(run.mode==='run'||run.mode==='watch')?{mode:run.mode,kind:run.kind,sid:run.session?run.session.id:null,sport:run.sport,base:run.base,resumeAt:run.resumeAt,paused:run.paused}:null;
  save();
}

/* hang, rezgés, ébren tartás */
var actx=null,wl=null;
function ensureAudio(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
function beep(f,d){
  if(!store.sound||!actx)return;
  try{var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='sine';o.frequency.value=f;g.gain.value=0.0001;o.connect(g);g.connect(actx.destination);
    g.gain.exponentialRampToValueAtTime(0.25,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d+0.03);}catch(e){}
}
function vib(p){try{if(store.sound&&navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function cue(t){
  if(t==='main'){beep(880,.15);setTimeout(function(){beep(1100,.22);},190);vib([150,80,150]);}
  else if(t==='ease'){beep(520,.35);vib(300);}
  else{beep(660,.22);vib(200);}
}
function fanfare(){beep(784,.15);setTimeout(function(){beep(988,.15);},200);setTimeout(function(){beep(1175,.35);},400);vib([200,100,200,100,300]);}
function lock(){try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}catch(e){}}
function unlock(){try{if(wl){wl.release();wl=null;}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(run.mode==='run'||run.mode==='watch')){lock();tick();}});

/* kétlépéses megerősítés */
var conf=null,confT=0;
function refreshArmed(){
  var els=document.querySelectorAll('[data-key]');
  for(var i=0;i<els.length;i++){var el=els[i],l=el.querySelector('.lbl');if(l)l.textContent=(el.getAttribute('data-key')===conf)?'Biztosan?':el.getAttribute('data-label');}
}
function arm(key,fn){
  if(conf===key){conf=null;clearTimeout(confT);fn();return;}
  conf=key;clearTimeout(confT);confT=setTimeout(function(){conf=null;refreshArmed();},4000);refreshArmed();
}

/* ================= nézetek ================= */
function setTab(t){
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++)tabs[i].setAttribute('aria-selected',tabs[i].getAttribute('data-tab')===t?'true':'false');
  ['plan','run','log'].forEach(function(v){$('view-'+v).hidden=(v!==t);});
}
function renderSound(){var b=$('sndBtn');b.setAttribute('aria-pressed',store.sound?'true':'false');b.innerHTML=ic('i-sound')+'<span>Hang: '+(store.sound?'be':'ki')+'</span>';}
function weekMeter(){
  var m=last7(),pct=Math.min(100,m/150*100);
  return '<div class="wk"><span class="eyebrow">Elmúlt 7 nap</span><span><b>'+Math.round(m)+'</b> <span class="muted">/ 150 perc</span></span></div>'+
         '<div class="meter" role="img" aria-label="'+Math.round(m)+' perc a heti 150-ből"><i style="width:'+pct.toFixed(1)+'%"></i></div>';
}

/* ---------- Terv ---------- */
function renderPlan(){
  var nx=nextItem(),ad=advice(),h='';
  if(ad){
    h+='<div class="card advice"><div class="eyebrow">Javaslat</div><h3>Ismételd meg a '+ad.pw+'. hetet</h3>'+
       '<p>Az előző héten '+(ad.hard>=2?ad.hard+' alkalommal alig tudtál beszélni':'átlagosan '+ad.avg.toFixed(1).replace('.',',')+' volt a megterhelés')+'. Az állóképesség gyorsabban fejlődik, ha a terhelés kényelmes marad, ezért érdemes még egy hetet ezen a szinten tölteni.</p>'+
       '<div class="btns"><button class="btn primary" data-act="repeat" data-w="'+ad.pw+'" type="button">'+ic('i-repeat')+'<span>A hét ismétlése</span></button>'+
       '<button class="btn" data-act="dismiss" data-w="'+ad.pw+'" type="button"><span>Továbblépek</span></button></div></div>';
  }
  if(metricsDue())h+='<div class="card"><div class="row"><div><div class="eyebrow">Esedékes</div><h3>Heti mérőszámok az órából</h3></div></div>'+
    '<p class="muted small">Nyugalmi pulzus, séta-pulzus és VO2max. Ezekből látszik a legtisztábban, hogyan fejlődik a szíved.</p>'+
    '<button class="btn" data-act="gometrics" type="button">'+ic('i-heart')+'<span>Beírom most</span></button></div>';
  h=heroHtml(nx)+h;
  h+='<details class="card guide"><summary><span><span class="eyebrow">Szabályok</span><h3>Így edzél</h3></span>'+ic('i-chev')+'</summary><ul>'+
     '<li>Heti legalább 150 perc mérsékelt mozgás a cél. A gyaloglás is beleszámít.</li>'+
     '<li>Beszélgetős teszt: edzés közben egész mondatokat tudj mondani. Ha nem megy, lassíts.</li>'+
     '<li>Kerékpár és gyaloglás felváltva, két kerékpáros nap között gyaloglás vagy pihenő.</li>'+
     '<li>Esőnapon az elliptikus tréner kiváltja az aznapi edzést, ugyanazzal a felépítéssel és időtartammal.</li>'+
     '<li>Nincs hajrá, emelkedő vagy intervallum. A program a tempó helyett az időt növeli.</li>'+
     '<li>A SIT-programot ezzel párhuzamosan ne csináld, amíg a kardiológus nem engedi.</li>'+
     '<li>Mellkasi szorítás, szokatlan fulladás vagy szédülés esetén állj meg, és kérj orvosi tanácsot.</li></ul></details>';
  WEEKS.forEach(function(w){
    var its=w.items,d=its.filter(isDone).length,mins=its.reduce(function(a,s){return a+s.total;},0)/60;
    var cur=nx&&nx.week===w.n;
    h+='<div class="card week'+(cur?' cur':'')+'"><div class="week-head"><span class="wnum" aria-hidden="true">'+w.n+'</span><div class="wt"><h2>'+w.n+'. hét'+(cur?'<span class="tag">Most</span>':'')+'</h2>'+
       '<span class="cnt">'+d+' / '+its.length+' kész · '+mins+' perc</span><span class="wdots" aria-hidden="true">'+its.map(function(s){return '<i class="p-'+(s.kind==='ref'?'soft':s.sport)+(isDone(s)?' on':'')+'"></i>';}).join('')+'</span></div></div><p class="muted" style="font-size:15px">'+esc(w.note)+'</p>';
    its.forEach(function(s){

function dialHtml(sub){

  return '<div class="dial"><svg viewBox="0 0 260 260" aria-hidden="true"><circle class="dtrack" cx="130" cy="130" r="118"/>'+t+
    '<circle class="dprog" id="dprog" cx="130" cy="130" r="118" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 130 130)"/></svg>'+
    '<div class="dcenter"><div class="big" id="big">00:00</div><div class="dsub">'+sub+'</div></div></div>';
}
function setDial(f){var d=$('dprog');if(d)d.style.strokeDashoffset=(100*(1-Math.min(1,Math.max(0,f)))).toFixed(2);}

/* nyitókép: a 6 hét kanyargó útvonalként */
function routeSvg(nx){
  var N=ALL.length,per=8,rows=Math.ceil(N/per),x0=30,x1=310,dy=46,y0=36,W=340,H=y0+(rows-1)*dy+30;
  var pts=ALL.map(function(s,i){var r=Math.floor(i/per),c=i%per,f=c/(per-1);return {x:r%2?x1-f*(x1-x0):x0+f*(x1-x0),y:y0+r*dy,r:r};});
  function pathTo(k){
    var d='M'+pts[0].x+' '+pts[0].y;
    for(var i=1;i<=k&&i<N;i++){
      var a=pts[i-1],b=pts[i];
      if(b.r!==a.r)d+=' A'+(dy/2)+' '+(dy/2)+' 0 0 '+(a.r%2?0:1)+' '+b.x+' '+b.y;else d+=' L'+b.x.toFixed(1)+' '+b.y;
    }
    return d;
  }
  var nIdx=nx?ALL.indexOf(nx):N-1,s='<svg class="route" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+doneCount()+' állomás kész a '+N+'-ből">';
  s+='<path class="rail" d="'+pathTo(N-1)+'"/>';
  if(nIdx>0)s+='<path class="trav" d="'+pathTo(nIdx)+'"/>';
  var seen={};
  ALL.forEach(function(it,i){
    var p=pts[i],done=isDone(it),sp=done?doneSport(it):it.sport,col=it.kind==='ref'?'var(--n-ref)':('var(--n-'+sp+')');
    if(!seen[it.week]){seen[it.week]=1;s+='<text class="wl" x="'+p.x+'" y="'+(p.y-14)+'" text-anchor="'+(p.r%2?'end':'start')+'">'+it.week+'. HÉT</text>';}
    if(it.kind==='ref')s+='<rect x="'+(p.x-5.5)+'" y="'+(p.y-5.5)+'" width="11" height="11" rx="2" transform="rotate(45 '+p.x+' '+p.y+')" fill="'+(done?col:'var(--night)')+'" stroke="'+col+'" stroke-width="2"/>';
    else s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(done?5.5:4.5)+'" fill="'+(done?col:'var(--night)')+'" stroke="'+col+'" stroke-width="2"/>';
    if(nx&&it.id===nx.id)s+='<circle class="nx" cx="'+p.x+'" cy="'+p.y+'" r="10"/>';
  });
  return s+'</svg>';
}

  var m=last7(),pct=Math.min(100,m/150*100),cw=nx?nx.week:6,W2=120,H2=60,waves='';
  for(var k=0;k<7;k++){var y=18+k*36,d='M-10 '+y;for(var x=0;x<=420;x+=30)d+=' Q'+(x+15)+' '+(y+(k%2?9:-9)*(1+((x/30)%3)/3))+' '+(x+30)+' '+y;waves+='<path d="'+d+'"/>';}
  var h='<section class="hero"><svg class="contours" viewBox="0 0 400 260" preserveAspectRatio="none" aria-hidden="true">'+waves+'</svg><div class="hero-in">'+
    '<span class="kicker"><i></i>'+(nx?cw+'. hét a hatból':'A program kész')+'</span>'+

  return h+'</div></section>';

function setPhaseUI(idx){
  var s=run.session,p=s.phases[idx],nx=s.phases[idx+1];

/* ================= időzítő ================= */
function tick(){
  if(run.mode==='run')tickRun();
  else if(run.mode==='watch'){var sec=Math.floor(elapsedMs()/1000),b=$('big');if(b)b.textContent=mmss(sec);setDial((sec%60)/60);}
}
function tickRun(){
  var e=elapsedMs()/1000;
  if(e>=run.total){finishRun(true);return;}
  var idx=0;while(e>=run.cum[idx])idx++;
  if(idx!==run.idx){var first=run.idx<0;run.idx=idx;setPhaseUI(idx);if(!first||e<1)cue(run.session.phases[idx].t);run.lastSec=-1;}
  var sl=Math.ceil(run.cum[idx]-e);
  if(sl!==run.lastSec){run.lastSec=sl;if(sl>=1&&sl<=3)beep(700,.08);}
  $('big').textContent=mmss(sl);
  var ps=idx?run.cum[idx-1]:0;setDial((e-ps)/(run.cum[idx]-ps));
  $('totRem').textContent=mmss(Math.ceil(run.total-e));
  for(var i=0;i<run.fills.length;i++){
    var s0=i?run.cum[i-1]:0,f=Math.min(1,Math.max(0,(e-s0)/(run.cum[i]-s0)));
    run.fills[i].style.width=(f*100).toFixed(1)+'%';
  }
}
function setupSession(s){
  var c=0;run.session=s;run.sport=s.sport;run.cum=[];
  s.phases.forEach(function(p){c+=p.s;run.cum.push(c);});run.total=c;
}
function go(){clearInterval(run.timer);run.timer=setInterval(tick,250);tick();}
function startRun(){
  var s=run.sel;if(run.mode!=='idle'||!s||s.kind!=='plan')return;
  if(run.rain)s=swapAs(s,'ellip');
  ensureAudio();lock();setupSession(s);
  run.kind='plan';run.base=0;run.resumeAt=Date.now();run.paused=false;run.idx=-1;run.lastSec=-1;run.mode='run';
  persist();renderRun();go();
}
function startWatch(kind,sport,s){
  if(run.mode!=='idle'){setTab('run');return;}
  ensureAudio();lock();
  run.kind=kind;run.sport=sport;run.session=s||null;run.base=0;run.resumeAt=Date.now();run.paused=false;run.mode='watch';
  persist();renderRun();setTab('run');go();
}
function togglePause(){
  if(run.mode!=='run'&&run.mode!=='watch')return;
  if(run.paused){run.resumeAt=Date.now();run.paused=false;}else{run.base=elapsedMs();run.paused=true;}
  setPauseBtn();persist();
}

function restore(){
  var a=store.active;if(!a)return;
  run.base=a.base||0;run.resumeAt=a.resumeAt||Date.now();run.paused=!!a.paused;
  var e=elapsedMs()/1000;
  if(a.mode==='run'){
    var s=byId(a.sid);
    if(!s||s.kind!=='plan'||e>s.total+3600){store.active=null;save();return;}
    if(a.sport&&a.sport!==s.sport)s=swapAs(s,a.sport);
    setupSession(s);run.kind='plan';run.mode='run';run.idx=-1;run.lastSec=-1;
  }else if(a.mode==='watch'){
    if(e>6*3600){store.active=null;save();return;}
    run.kind=a.kind;run.sport=a.sport||'bike';run.session=a.sid?byId(a.sid):null;run.mode='watch';
    if(run.kind==='ref'&&!run.session){store.active=null;save();run.mode='idle';return;}

var CH={};
function fmtV(d,v){return d.time?mmss(v):(d.dec?dec((Math.round(v*10)/10).toFixed(1)):String(Math.round(v)));}
function chartBlock(d){
  var p=d.pts.slice().sort(function(a,b){return a.d<b.d?-1:1;}),last=p[p.length-1],first=p[0];
  var h='<div class="trend"><div class="row"><span class="lbl-t">'+d.t+'</span><span class="tv"><b>'+fmtV(d,last.v)+'</b>'+(d.u?' <span class="muted small">'+d.u+'</span>':'')+'</span></div>';
  if(p.length<2)return h+'<p class="hint">Egy mérés van. A második után itt megjelenik a trend.</p></div>';
  var delta=last.v-first.v,good=d.better==='lower'?delta<0:delta>0;
  var dtxt=Math.abs(delta)<1e-9?'Nem változott az első méréshez képest.':
    (delta>0?'+':'-')+fmtV(d,Math.abs(delta))+(d.u?' '+d.u:'')+' az első méréshez képest, '+(good?'kedvező irány.':'egyelőre nem kedvező irány.');
  var W=320,H=132,L=40,R=12,T=12,B=24,pw=W-L-R,ph=H-T-B;
  var ts=p.map(function(o){return new Date(o.d).getTime();}),t0=ts[0],t1=ts[ts.length-1];
  var vs=p.map(function(o){return o.v;}),vmin=Math.min.apply(null,vs),vmax=Math.max.apply(null,vs);
  var span=vmax-vmin||Math.max(1,Math.abs(vmax)*0.05),lo=vmin-span*0.15,hi=vmax+span*0.15;
  var xs=p.map(function(o,i){return L+(t1>t0?(ts[i]-t0)/(t1-t0):(p.length>1?i/(p.length-1):.5))*pw;});
  var ys=p.map(function(o){return T+(1-(o.v-lo)/(hi-lo))*ph;});
  var yMax=T+(1-(vmax-lo)/(hi-lo))*ph,yMin=T+(1-(vmin-lo)/(hi-lo))*ph;
  CH[d.k]={d:d,p:p,xs:xs,ys:ys};
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(d.t)+': '+fmtV(d,first.v)+'-ról '+fmtV(d,last.v)+'-ra">';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yMax.toFixed(1)+'" y2="'+yMax.toFixed(1)+'" class="gl"/>';
  if(vmax!==vmin)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yMin.toFixed(1)+'" y2="'+yMin.toFixed(1)+'" class="gl"/>';
  s+='<text x="'+(L-6)+'" y="'+(yMax+4).toFixed(1)+'" text-anchor="end" class="ax">'+fmtV(d,vmax)+'</text>';
  if(vmax!==vmin)s+='<text x="'+(L-6)+'" y="'+(yMin+4).toFixed(1)+'" text-anchor="end" class="ax">'+fmtV(d,vmin)+'</text>';
  s+='<text x="'+L+'" y="'+(H-6)+'" text-anchor="start" class="ax">'+esc(fmtDay(first.d))+'</text>';
  s+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" class="ax">'+esc(fmtDay(last.d))+'</text>';
  s+='<polyline class="ln" points="'+xs.map(function(x,i){return x.toFixed(1)+','+ys[i].toFixed(1);}).join(' ')+'"/>';
  xs.forEach(function(x,i){var e=i===xs.length-1;s+='<circle class="pt" cx="'+x.toFixed(1)+'" cy="'+ys[i].toFixed(1)+'" r="'+(e?5.5:4)+'"/>';});
  s+='<circle class="hl" id="hl-'+d.k+'" cx="0" cy="0" r="8" visibility="hidden"/>';
  s+='<rect class="hit" data-k="'+d.k+'" x="'+(L-10)+'" y="0" width="'+(pw+20)+'" height="'+H+'" fill="transparent"/></svg>';
  return h+'<p class="hint">'+dtxt+'</p>'+s+'<p class="hint cap" id="cap-'+d.k+'">Érintsd meg a grafikont az egyes értékekért.</p></div>';
}
function trendsCard(){
  var M=store.metrics,L=store.log;CH={};
  var pick=function(arr,f){return arr.filter(function(x){return x[f];}).map(function(x){return {d:x.date,v:x[f]};});};
  var defs=[
    {k:'rhr',t:'Nyugalmi pulzus',u:'ütés/perc',better:'lower',pts:pick(M,'rhr')},
    {k:'vo2',t:'Kardiófitnesz (VO2max)',u:'ml/kg/perc',better:'higher',dec:1,pts:pick(M,'vo2')},

  if(!defs.length)return '<div class="card"><div class="eyebrow">Trendek</div><p class="muted small">Az óra adataiból itt rajzolódik ki a fejlődés: nyugalmi pulzus, VO2max, séta-pulzus, a referenciakör ideje és pulzusa, valamint a pulzusesés edzés után.</p></div>';

function onChart(ev){
  var r=ev.target;if(!r||!r.classList||!r.classList.contains('hit'))return;

  var b=r.ownerSVGElement.getBoundingClientRect(),x=(ev.clientX-b.left)/b.width*320,bi=0;
  for(var i=1;i<c.xs.length;i++)if(Math.abs(c.xs[i]-x)<Math.abs(c.xs[bi]-x))bi=i;

  var cap=$('cap-'+k);if(cap)cap.textContent=fmtDay(c.p[bi].d)+': '+fmtV(c.d,c.p[bi].v)+(c.d.u?' '+c.d.u:'');

document.addEventListener('click',function(ev){
  var t=ev.target.closest?ev.target.closest('[data-act]'):null;if(!t)return;
  var a=t.getAttribute('data-act');
  switch(a){
    case 'tab':setTab(t.getAttribute('data-tab'));break;
    case 'pick':if(run.mode==='idle'){run.sel=byId(t.getAttribute('data-sid'));run.rain=false;renderRun();}setTab('run');break;
    case 'start':startRun();break;
    case 'rain':run.rain=t.getAttribute('data-v')==='1';renderRun();break;
    case 'rainpick':if(run.mode==='idle'){run.sel=byId(t.getAttribute('data-sid'));run.rain=true;renderRun();}setTab('run');break;
    case 'defer':store.defer[t.getAttribute('data-sid')]=dayKey(Date.now());save();if(run.mode==='idle'){run.rain=false;run.sel=nextItem();}renderAll();renderRun();setTab('run');break;
    case 'refstart':
      var rn=($('rName')?$('rName').value:'').trim().slice(0,60),rk=numIn('rKm',0.1,100,true);
      if(!rn&&!rk){$('rMsg').textContent='Add meg az útvonalat vagy a távot, hogy mindig ugyanazt a kört mérd.';break;}
      store.route={name:rn,km:rk?Math.round(rk*100)/100:null,sport:routeSport};save();
      startWatch('ref',routeSport,byId(t.getAttribute('data-sid')));break;
    case 'rsport':
      routeSport=t.getAttribute('data-v');
      [].forEach.call(document.querySelectorAll('#rSport .opt'),function(b){b.classList.toggle('on',b===t);});break;
    case 'free':startWatch('free',t.getAttribute('data-sport'),null);break;
    case 'pause':togglePause();break;
    case 'skip':skipPhase();break;
    case 'stop':arm('stop',function(){finishRun(false);});break;
    case 'watchdone':finishWatch();break;
    case 'cancel':arm('cancel',resetRun);break;
    case 'rpe':
      run.rpe=parseInt(t.getAttribute('data-v'),10);
      [].forEach.call(document.querySelectorAll('#rpe button'),function(b){b.classList.toggle('on',b===t);});break;
    case 'breath':
      run.breath=t.getAttribute('data-v');
      [].forEach.call(document.querySelectorAll('#breath .opt'),function(b){b.classList.toggle('on',b===t);});
      $('breathHint').textContent={full:'Pontosan ez a cél.',short:'Még rendben, de legközelebb lassíts egy kicsit.',none:'Legközelebb menj lassabban, vagy tarts hosszabb pihenőt. Ha mellkasi szorítást vagy szédülést éreztél, szólj az orvosodnak.'}[run.breath]||'';break;
    case 'savefb':saveFeedback();break;
    case 'dropfb':arm('dropfb',resetRun);break;
    case 'del':
      var id=parseInt(t.getAttribute('data-id'),10);
      arm('del'+id,function(){store.log=store.log.filter(function(x){return x.id!==id;});save();if(run.mode==='idle')run.sel=nextItem();renderAll();});break;
    case 'repeat':
      var w=t.getAttribute('data-w');store.resets[w]=new Date().toISOString();delete store.dismissed[w];save();run.sel=nextItem();renderAll();break;
    case 'dismiss':store.dismissed[t.getAttribute('data-w')]=true;save();renderPlan();break;
    case 'msport':
      manualSport=t.getAttribute('data-v');
      [].forEach.call(document.querySelectorAll('#mSport .opt'),function(b){b.classList.toggle('on',b===t);});break;
    case 'msave':saveManual();break;
    case 'metsave':saveMetrics();break;
    case 'metdel':
      var mid=parseInt(t.getAttribute('data-id'),10);
      arm('m'+mid,function(){store.metrics=store.metrics.filter(function(m){return m.id!==mid;});save();renderAll();});break;
    case 'gometrics':setTab('log');var mc=$('metrics');if(mc)mc.scrollIntoView({block:'start'});break;
    case 'copylog':copyText(logText(),'copyMsg','logText');break;
    case 'export':
      var o={v:2,log:store.log,metrics:store.metrics,route:store.route,hrCap:store.hrCap,resets:store.resets,dismissed:store.dismissed};
      copyText(JSON.stringify(o),'bkMsg','bkText');break;
    case 'showimport':
      var ta=$('bkText');ta.hidden=false;ta.readOnly=false;ta.value='';ta.placeholder='Illeszd be ide a mentést';ta.focus();$('bkLoad').hidden=false;
      $('bkMsg').textContent='A betöltés felülírja a mostani naplót.';break;
    case 'import':arm('import',doImport);break;
    case 'snd':store.sound=!store.sound;save();renderSound();ensureAudio();break;
  }
});
document.addEventListener('change',function(ev){
  if(ev.target&&ev.target.id==='hrCap'){store.hrCap=numIn('hrCap',80,200);save();renderLog();}
});

/* ================= indulás ================= */
run.sel=nextItem();
renderAll();renderRun();setTab('plan');
restore();
})();
</script>

</body>
</html>

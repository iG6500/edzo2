<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alapozó">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{overscroll-behavior-y:none}</style>
<title>Állóképesség Alapozó</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-szerű, egyoszlopos app. Nagy cím fülenként, kártyák és csoportosított listák szürke alapon, áttetsző alsó sáv.
   Szín = mozgásforma (kék kerékpár, lila gyaloglás, indigó elliptikus, narancs mérőpont); a zöld a teljesítést, a rózsaszín a szív-adatokat jelzi. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.08); --segon:#ffffff;
  --ink:#000000; --ink2:rgba(60,60,67,.85); --muted:rgba(60,60,67,.6); --line:rgba(60,60,67,.2); --track:rgba(120,120,128,.18);
  --accent:#007aff; --accent-ink:#ffffff;
  --bike:#32ade6; --walk:#af52de; --ellip:#5856d6; --ease:#ff9500; --soft:#8e8e93; --ref:#ff9500;
  --danger:#ff3b30; --heart:#ff2d55; --good:#34c759; --str:#a2845e;
  --n-bike:var(--bike); --n-walk:var(--walk); --n-ellip:var(--ellip); --n-ref:var(--ref); --night:var(--surface);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.16); --segon:#636366;
    --ink:#ffffff; --ink2:rgba(235,235,245,.85); --muted:rgba(235,235,245,.6); --line:rgba(84,84,88,.65); --track:rgba(120,120,128,.32);
    --accent:#0a84ff; --accent-ink:#ffffff;
    --bike:#64d2ff; --walk:#bf5af2; --ellip:#5e5ce6; --ease:#ff9f0a; --soft:#98989d; --ref:#ff9f0a;
    --danger:#ff453a; --heart:#ff375f; --good:#30d158; --str:#ac8e68;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.16); --segon:#636366;
  --ink:#ffffff; --ink2:rgba(235,235,245,.85); --muted:rgba(235,235,245,.6); --line:rgba(84,84,88,.65); --track:rgba(120,120,128,.32);
  --accent:#0a84ff; --accent-ink:#ffffff;
  --bike:#64d2ff; --walk:#bf5af2; --ellip:#5e5ce6; --ease:#ff9f0a; --soft:#98989d; --ref:#ff9f0a;
  --danger:#ff453a; --heart:#ff375f; --good:#30d158; --str:#ac8e68;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.42 var(--f-body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto;padding-block:6px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:20px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{margin:0;font-family:var(--f-disp);text-wrap:balance;letter-spacing:-.02em;line-height:1.15}
p{margin:0}
.ltitle{font-size:34px;font-weight:700;letter-spacing:-.03em;padding-top:8px;margin-bottom:-6px}
.muted{color:var(--muted)} .small{font-size:14px}
.eyebrow{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.01em;color:var(--muted)}
.p-bike{--ph:var(--bike)} .p-walk{--ph:var(--walk)} .p-ellip{--ph:var(--ellip)} .p-ease{--ph:var(--ease)} .p-soft{--ph:var(--soft)}
.p-ref{--ph:var(--ref)} .p-str{--ph:var(--str)} .p-heart{--ph:var(--heart)} .p-tempo{--ph:var(--heart)} .p-accent{--ph:var(--accent)} .p-danger{--ph:var(--danger)} .p-good{--ph:var(--good)}

/* alsó sáv */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  background:var(--surface);background:color-mix(in srgb,var(--surface) 82%,transparent);border-top:.5px solid var(--line);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tabs-in{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;background:none;border:0;color:var(--soft);font:500 10.5px var(--f-body);letter-spacing:.01em;cursor:pointer}
.tab .ic{width:26px;height:26px;stroke-width:1.7}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] .ic{stroke-width:2.1}

/* kártyák, gombok */
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:22px;font-weight:700}
.card h3{font-size:20px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sect{display:flex;flex-direction:column;gap:7px}
.sect > .eyebrow{padding-inline:16px}
.sect-foot{font-size:13px;color:var(--muted);padding-inline:16px;line-height:1.38}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--fill);color:var(--accent);font:600 16px var(--f-body);letter-spacing:-.01em;cursor:pointer;text-align:center;transition:opacity .15s}
.btn:active{opacity:.55}
.btn.primary{background:var(--accent);color:var(--accent-ink);min-height:50px;font-size:17px;border-radius:14px}
.btn.sm{min-height:32px;padding:0 14px;font-size:15px;border-radius:999px}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns .btn{flex:1 1 140px}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.advice{background:color-mix(in srgb,var(--ease) 9%,var(--surface))}
.advice .eyebrow{color:var(--ease);font-weight:600}
.tag{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;vertical-align:2px}

/* Ma kártya és összegzés */
.today{background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.today .tk{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;color:var(--ph)}
.today .tk .ic{width:18px;height:18px;stroke-width:2}
.today h2{font-size:28px;font-weight:700;letter-spacing:-.03em}
.today .tmeta2{color:var(--muted);font-size:15px}
.today-act{display:flex;gap:10px;margin-top:4px}
.today-act .primary{flex:1}
.btn.rainbtn{width:50px;min-height:50px;padding:0;border-radius:14px}
.btn.rainbtn .ic{width:24px;height:24px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stat .lab{font-size:13px;font-weight:600;color:var(--muted)}
.stat .val{font:700 28px/1 var(--f-num);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .val small{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0}
.ringrow{display:flex;align-items:center;gap:10px}
.ring{width:40px;height:40px;flex:none}
.ring .rt{fill:none;stroke:var(--track);stroke-width:6}
.ring .rp{fill:none;stroke:var(--good);stroke-width:6;stroke-linecap:round}
.ring .rp.acc{stroke:var(--accent)}
.pbar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--accent)}

/* útvonaltérkép */
.routecard{gap:10px;padding-bottom:14px}
.route{width:100%;height:auto;display:block;overflow:visible}
.route .rail{fill:none;stroke:var(--track);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.route .trav{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.route .wl{fill:var(--muted);font:600 9.5px var(--f-body);letter-spacing:.06em}
.route .nx{fill:none;stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.route .nx{animation:none}}
.hlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.hlegend span{display:inline-flex;align-items:center;gap:6px}
.hlegend i{width:9px;height:9px;border-radius:50%}
/* csoportosított lista */
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.li{position:relative;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;min-height:46px;padding:8px 16px;width:100%;border:0;background:transparent;color:var(--ink);font:400 17px var(--f-body);letter-spacing:-.02em;text-align:left;cursor:pointer}
.li + .li::before,.li + .wacc::before,.wacc + .wacc::before,.wacc + .li::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:.5px solid var(--line)}
.li-btn:active{background:var(--fill2)}
.li.danger{color:var(--danger)}
.li .mico{background:var(--ph);color:#fff}
.li .inl{width:96px;text-align:right;border:0;background:transparent;color:var(--muted);font:400 17px var(--f-body);padding:0;min-height:0}
.li .inl:focus{color:var(--ink);outline:none}
.sw{appearance:none;-webkit-appearance:none;position:relative;width:51px;height:31px;margin:0;border-radius:16px;background:var(--fill);cursor:pointer;transition:background .2s}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw:checked{background:var(--good)}
.sw:checked::before{transform:translateX(20px)}

/* hetek */
.wacc{position:relative}
.wsum{list-style:none;display:grid;grid-template-columns:36px 1fr auto 14px;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}
.wsum::-webkit-details-marker{display:none}
.wsum > .ic{width:14px;height:14px;color:var(--soft);stroke-width:2.4;transition:transform .2s}
.wacc[open] .wsum > .ic{transform:rotate(180deg)}
.wbadge{position:relative;width:36px;height:36px;display:grid;place-items:center}
.wbadge .ring{position:absolute;inset:0;width:36px;height:36px}
.wbadge .ring .rt,.wbadge .ring .rp{stroke-width:4}
.wbadge b{position:relative;font:700 14px var(--f-num)}
.wbadge .ic{position:relative;width:16px;height:16px;color:var(--good);stroke-width:2.6}
.wt{display:flex;flex-direction:column;min-width:0}
.wt > b{font-weight:600;font-size:17px;letter-spacing:-.02em}
.wt .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wacc[open] .wt .sub{white-space:normal}
.wsum .cnt{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.wbody{padding-bottom:6px}
.wfoot{font-size:13px;color:var(--muted);padding:4px 16px 8px 64px}
.sess{position:relative;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:9px 16px 9px 22px}
.sess::before{content:"";position:absolute;top:0;left:64px;right:0;border-top:.5px solid var(--line)}
.sess.next{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.st{display:flex;flex-direction:column;min-width:0}
.st b{font-weight:500;font-size:16px}
.st .meta{font-size:13px;color:var(--muted)}
.mico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--ph) 16%,transparent);color:var(--ph)}
.mico .ic{width:17px;height:17px;stroke-width:2}
.mico.on{background:var(--ph);color:#fff}

/* választók */
.subtabs,.opts.two-up,.opts.three-up{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.subtabs button,.opts.two-up .opt,.opts.three-up .opt{min-height:32px;border:0;border-radius:7px;background:transparent;color:var(--ink);font:500 13.5px var(--f-body);letter-spacing:-.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 6px;text-align:center}
.subtabs button.on,.opts.two-up .opt.on,.opts.three-up .opt.on{background:var(--segon);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.opts.three-up .opt{flex-direction:column;gap:2px;min-height:52px}
.opts.three-up .opt b{font:700 22px/1 var(--f-num)}
.opts .opt .ic{width:18px;height:18px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts:not(.two-up):not(.three-up):not(.seven) .opt{min-height:46px;border:0;border-radius:12px;background:var(--fill2);color:var(--ink);font:400 16px var(--f-body);text-align:left;padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.opts:not(.two-up):not(.three-up):not(.seven) .opt.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:600}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{min-height:44px;border:0;border-radius:10px;background:var(--fill2);color:var(--ink);font:600 19px var(--f-num);cursor:pointer}
.rpe button.on{background:var(--accent);color:#fff}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl-t{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.01em;padding-left:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=number],input[type=date],input[type=text],textarea{width:100%;font:400 17px var(--f-body);color:var(--ink);background:var(--fill2);border:0;border-radius:10px;padding:10px 12px;min-height:44px;-webkit-appearance:none;appearance:none}
textarea{min-height:80px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-size:16px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);min-height:1.2em;line-height:1.38}
#spMsg:empty,#bkMsg:empty,#wdMsg:empty{display:none}
details.guide{padding:0}
details.guide summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary .ic{color:var(--soft);transition:transform .2s}
details.guide[open] summary .ic{transform:rotate(180deg)}
details.guide ul{margin:0;padding:0 16px 16px 34px;display:flex;flex-direction:column;gap:8px;font-size:15px}
details.guide li::marker{color:var(--accent)}

/* időzítő */
.segs{display:flex;gap:2px;height:6px}
.seg{border-radius:3px;background:var(--track);overflow:hidden;min-width:3px}
.seg i{display:block;height:100%;width:0;background:var(--ph)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--ph)}
.timer{display:flex;flex-direction:column;gap:14px;border-radius:20px;padding:18px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--ph) 15%,transparent);color:var(--ph);font-size:14px;font-weight:600}
.pill .ic{width:17px;height:17px;stroke-width:2.1}
.dial{position:relative;width:min(74vw,290px);aspect-ratio:1;max-width:100%;margin:6px auto 0}
.dial svg{width:100%;height:100%;display:block}
.dial .dtrack{fill:none;stroke:color-mix(in srgb,var(--ph) 18%,transparent);stroke-width:16}
.dial .dprog{fill:none;stroke:var(--ph);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .5s}
.dial .dtick{stroke:transparent}
.dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.big{font:700 clamp(60px,19vw,92px)/1 var(--f-num);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
.dsub{font-size:13px;font-weight:500;color:var(--muted)}
.cue{text-align:center;color:var(--ink2);font-size:17px;min-height:2.9em;max-width:32ch;margin:0 auto;text-wrap:balance}
.tmeta{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.tmeta b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrls .span2{grid-column:1/-1}
.fbtime{font:700 64px/1 var(--f-num);letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* napló */
.verdict h2{font-size:28px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum div{display:flex;flex-direction:column;gap:2px}
.sum b{font:700 24px/1.1 var(--f-num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--muted)}
.ins-list{display:flex;flex-direction:column}
.ins{position:relative;display:grid;grid-template-columns:32px 1fr;gap:12px;padding-block:12px}
.ins + .ins::before{content:"";position:absolute;top:0;left:44px;right:0;border-top:.5px solid var(--line)}
.ins:first-child{padding-top:2px}.ins:last-child{padding-bottom:2px}
.ins b{display:block;font-weight:600}
.ins p{font-size:15px;color:var(--muted);margin-top:2px}
.ins-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--fill);color:var(--soft)}
.ins-ic .ic{width:18px;height:18px;stroke-width:2.2}
.t-good .ins-ic{background:var(--good);color:#fff}
.t-warn .ins-ic{background:var(--ease);color:#fff}
.trends{display:flex;flex-direction:column}
.trend{position:relative;display:flex;flex-direction:column;gap:6px;padding-block:14px}
.trend + .trend::before{content:"";position:absolute;top:0;left:0;right:0;border-top:.5px solid var(--line)}
.trend:first-child{padding-top:4px}
.trend .row{flex-wrap:wrap;gap:4px 12px}
.tv{white-space:nowrap}
.tv b{font:700 26px/1 var(--f-num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
svg.ch{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
svg.ch .gl{stroke:var(--line);stroke-width:1}
svg.ch .ax{fill:var(--muted);font:11px var(--f-body);font-variant-numeric:tabular-nums}
svg.ch .ln{fill:none;stroke:var(--heart);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg.ch .pt{fill:var(--heart);stroke:var(--surface);stroke-width:2}
svg.ch .hl{fill:none;stroke:var(--heart);stroke-width:1.5}
svg.wkc .bar{fill:var(--accent)} svg.wkc .bar.ok{fill:var(--good)} svg.wkc .bar.cur{opacity:.45}
svg.wkc .bar0{fill:var(--line)} svg.wkc .tgt{stroke:var(--soft);stroke-width:1;stroke-dasharray:4 4}
svg.wkc .bv{fill:var(--ink);font:600 11px var(--f-num);font-variant-numeric:tabular-nums}
.cap{color:var(--ink)}
.sumpre{margin:0;padding:12px 14px;border-radius:10px;background:var(--fill2);font:14px/1.5 var(--f-body);white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.wgrp{gap:0;padding:4px 0}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 16px 6px;flex-wrap:wrap}
.ghead b{font-weight:600;font-size:17px}
.ghead span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow{position:relative}
.lrow::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:.5px solid var(--line)}
.lrow summary{list-style:none;display:grid;grid-template-columns:30px 1fr auto auto;gap:12px;align-items:center;padding:10px 16px;cursor:pointer}
.lrow summary::-webkit-details-marker{display:none}
.lrow summary > .ic{width:14px;height:14px;color:var(--soft);stroke-width:2.4;transition:transform .2s}
.lrow[open] summary > .ic{transform:rotate(180deg)}
.lt{display:flex;flex-direction:column;min-width:0}
.lt b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotw{width:8px;height:8px;border-radius:50%;background:var(--ease)}
.lbody{display:flex;flex-direction:column;gap:10px;padding:0 16px 14px 58px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 9px;border-radius:7px;background:var(--fill2);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.chip.warn{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.empty{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty > .ic{width:30px;height:30px;color:var(--accent)}
.opts.seven{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.opts.seven .opt{min-height:36px;border:0;border-radius:7px;background:transparent;color:var(--ink);font:500 13.5px var(--f-body);cursor:pointer;padding:0}
.opts.seven .opt.on{background:var(--accent);color:#fff;font-weight:600}
.tnote{font-size:14px;color:var(--ink2);background:var(--fill2);border-radius:10px;padding:10px 12px}
.strh{display:flex;align-items:center;gap:12px}
.strcnt{margin-left:auto;margin-right:8px;font:600 15px var(--f-num);color:var(--muted)}
.strbody{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.exl{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.exl li::marker{color:var(--str);font-weight:700}
.exl b{display:block;font-weight:600}
.exl span{font-size:14px;color:var(--muted)}
@media (max-width:360px){.sum b{font-size:21px}.two{grid-template-columns:1fr}.stat .val{font-size:24px}.today h2{font-size:24px}}
</style>
</head>

<script>
(function(){
'use strict';

/* ================= tárolás ================= */
var KEY='alapozo-v2',OLDKEY='bringas-alapozo-v1';
var store={v:2,log:[],metrics:[],defer:{},route:{name:'',km:null,sport:'bike'},sound:true,hrCap:null,resets:{},dismissed:{},active:null,
  sports:{bike:true,walk:true,ellip:true},onboarded:false,days:5,block:1};
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var o=JSON.parse(raw);
      if(o&&Array.isArray(o.log)){
        store.log=o.log;store.sound=o.sound!==false;store.hrCap=o.hrCap||null;
        store.resets=o.resets||{};store.dismissed=o.dismissed||{};store.active=o.active||null;store.voice=o.voice!==false;
        store.metrics=Array.isArray(o.metrics)?o.metrics:[];
        if(o.sports)store.sports=o.sports;
        store.onboarded=o.onboarded!==undefined?!!o.onboarded:true;
        store.days=[3,4,5].indexOf(o.days)>=0?o.days:5;store.block=o.block===2?2:1;
        store.wdays=Array.isArray(o.wdays)?o.wdays:null;store.gapAck=o.gapAck||null;
        if(o.route)store.route=o.route;
        store.defer=o.defer||{};
      }
      return;
    }
    var old=localStorage.getItem(OLDKEY);
    if(old){
      var p=JSON.parse(old);
      if(p&&Array.isArray(p.log)){
        store.log=p.log.map(function(x){
          return {id:x.id,date:x.date,kind:x.type==='ref'?'ref':'free',sport:'bike',sid:null,week:null,
            title:x.type==='ref'?'Referenciakör':'Kerékpár (korábbi program)',min:x.min,sec:x.refSec||null,
            full:!!x.full,rpe:x.rpe,breath:x.breath,hrAvg:x.hrAvg,hrMax:x.hrMax,km:null,note:x.note||''};
        });
        save();
      }
    }
  }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
load();

/* ================= segédek ================= */
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return (n<10?'0':'')+n;};
var mmss=function(s){s=Math.max(0,Math.round(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad(m):pad(m))+':'+pad(s%60);};
var ic=function(id){return '<svg class="ic" aria-hidden="true"><use href="#'+id+'"/></svg>';};
var fmtMin=function(m){m=Math.round(m);return m>=60?Math.floor(m/60)+' ó '+m%60+' p':m+' p';};
var km=function(v){return String(Math.round(v*100)/100).replace('.',',')+' km';};
var dayKey=function(d){d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
function fmtDate(iso){
  try{var d=new Date(iso);return d.toLocaleDateString('hu-HU',{weekday:'short',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});}
  catch(e){return String(iso).slice(0,16);}
}
function numIn(id,lo,hi,dec){
  var el=$(id);if(!el||el.value==='')return null;
  var n=dec?parseFloat(String(el.value).replace(',','.')):parseInt(el.value,10);
  return (isFinite(n)&&n>=lo&&n<=hi)?n:null;
}

/* ================= a program ================= */
var SPORT={
  bike:{name:'Kerékpár',short:'Kerékpár',icon:'i-bike',main:'Tekerés',ease:'Lassú gurulás',mainW:'tekerés',easeW:'gurulás',
    cWarm:'Lazán tekerj, a pulzusod fokozatosan emelkedjen.',cMain:'Beszélgetős tempó: egész mondatokat tudj mondani.',cEase:'Szinte csak gurulj, lélegezz mélyen.'},
  walk:{name:'Gyaloglás',short:'Gyaloglás',icon:'i-walk',main:'Tempós séta',ease:'Lassú séta',mainW:'tempós séta',easeW:'lassú séta',
    cWarm:'Kényelmes sétatempó, lazítsd a vállad.',cMain:'Szaporább lépések, lendülő kar. Még tudj beszélgetni.',cEase:'Lassíts le, lélegezz mélyen és egyenletesen.'},
  str:{name:'Erősítés',short:'Erősítés',icon:'i-dumb',main:'Erősítés',ease:'Pihenő',mainW:'erősítés',easeW:'pihenő',cWarm:'',cMain:'',cEase:''},
  ellip:{name:'Elliptikus tréner',short:'Elliptikus',icon:'i-ellip',main:'Elliptikus',ease:'Lassú lépés',mainW:'elliptikus',easeW:'lassú lépés',
    cWarm:'Kis ellenállás, lassú, kerek mozdulatok.',cMain:'Egyenletes tempó, kis-közepes ellenállás. Tudj beszélgetni.',cEase:'Vedd le az ellenállást, szinte csak lépegess.'}
};
function phName(t,sp){if(t==='warm')return 'Bemelegítés';if(t==='cool')return 'Levezetés';if(t==='tempo')return 'Tempós szakasz';return t==='main'?SPORT[sp].main:SPORT[sp].ease;}
function phCue(t,sp){
  if(t==='warm')return SPORT[sp].cWarm;
  if(t==='tempo')return 'Emelj kicsit a tempón: már csak rövid mondatokat tudj mondani. Ne hajrázz.';
  if(t==='cool')return 'Egyre lazábban, hagyd, hogy a légzésed lecsillapodjon.';
  return t==='main'?SPORT[sp].cMain:SPORT[sp].cEase;
}
/* esőnap: ugyanaz az edzés, más mozgásformával; a tervben ugyanannak számít */
function swapAs(s,sp){var o={};for(var k in s)o[k]=s[k];o.sport=sp;o.orig=s.sport;o.title=SPORT[sp].name+' (esőnap)';return o;}
function phClass(t,sp){return (t==='warm'||t==='cool')?'soft':t==='tempo'?'tempo':(t==='main'?sp:'ease');}
function phIcon(t,sp){return (t==='main'||t==='ease'||t==='tempo')?SPORT[sp].icon:'i-timer';}

/* Az edzések paraméterekből épülnek: teljes idő (perc) és ismétléshossz (0 = folyamatos).
   A heti percek simítva nőnek (legfeljebb ~15% hetente); kevesebb edzésnapnál a megmaradó edzések arányosan hosszabbak. */
function S(w,sp,min,rep,title,key){return {kind:'plan',week:w,sport:sp,base:sp,baseTitle:title,title:title,min:min,rep:rep||0,key:!!key,warm:0,cool:0,blocks:[],phases:[],total:min*60};}
var bike=function(w,min,rep){return S(w,'bike',min,rep,'Kerékpár');};
var walk=function(w,min){return S(w,'walk',min,0,'Gyaloglás');};
var longb=function(w,min,rep){return S(w,'bike',min,rep,'Hosszú kör',true);};
/* iramváltó: könnyű szakaszok között rövid, kicsit tempósabb szakaszok (haladó blokk) */
var iram=function(w,warm,reps,easy,tempo,cool){
  var ph=[{t:'warm',s:warm*60}];
  for(var i=0;i<reps;i++){ph.push({t:'main',s:easy*60});ph.push({t:'tempo',s:tempo*60});}
  ph.push({t:'main',s:easy*60});ph.push({t:'cool',s:cool*60});
  var tot=ph.reduce(function(a,p){return a+p.s;},0);
  return {kind:'plan',key:true,iram:true,week:w,sport:'bike',base:'bike',baseTitle:'Iramváltó',title:'Iramváltó',min:tot/60,warm:warm,reps:reps,easy:easy,tempo:tempo,cool:cool,blocks:[],phases:ph,total:tot};
};
var ref=function(w,title,rid){return {kind:'ref',id:rid,week:w,sport:'bike',title:title,total:0};};
function shape(it,min){
  if(it.iram)return;
  var warm=min>=40?5:(min>=30?4:3),cool=warm,main=min-warm-cool,blocks=[];
  if(it.rep>0&&main>it.rep){
    var n=Math.floor(main/(it.rep+1)),left=main-n*(it.rep+1);
    for(var i=0;i<n;i++)blocks.push([it.rep,1]);
    if(left>=3)blocks.push([left,0]);else{blocks[n-1][1]=0;cool+=left+1;}
  }else blocks=[[main,0]];
  var ph=[{t:'warm',s:warm*60}];
  blocks.forEach(function(b){ph.push({t:'main',s:b[0]*60});if(b[1])ph.push({t:'ease',s:b[1]*60});});
  ph.push({t:'cool',s:cool*60});
  it.warm=warm;it.cool=cool;it.blocks=blocks;it.phases=ph;it.total=min*60;
}

var WEEKS=[
  {n:1,block:1,note:'Ismerkedés. Rövid tekerési szakaszok pihenőkkel, a gyaloglás egyben megy.',items:[
    ref(1,'Kiinduló mérés','ref0'), bike(1,25,5), walk(1,20), bike(1,25,5), walk(1,25), bike(1,25,5)]},
  {n:2,block:1,note:'Hosszabb szakaszok, ugyanaz a kényelmes tempó.',items:[
    bike(2,30,8), walk(2,25), bike(2,30,8), walk(2,25), bike(2,30,8)]},
  {n:3,block:1,note:'Megjelenik a hosszú edzés. A hét végén félidős mérés.',items:[
    bike(3,30,10), walk(3,30), bike(3,35,10), walk(3,25), longb(3,40,12), ref(3,'Félidős mérés','ref3')]},
  {n:4,block:1,note:'Könnyebb hét, hogy a szervezet beépítse az eddigi munkát.',items:[
    bike(4,30,12), walk(4,30), bike(4,30,12), walk(4,30)]},
  {n:5,block:1,note:'Hosszú, egyenletes szakaszok. A tempó nem nő, csak az idő.',items:[
    bike(5,35,15), walk(5,30), bike(5,35,15), walk(5,30), longb(5,45,20)]},
  {n:6,block:1,note:'Fél óra egyhuzamban. A hét végén záró mérés ugyanazon a körön.',items:[
    bike(6,40,0), walk(6,35), bike(6,40,0), walk(6,30), longb(6,50,25), ref(6,'Záró mérés','ref6')]},
  {n:7,block:2,note:'Haladó blokk. Hosszabb, egyenletes edzések, a tempó még mindig beszélgetős.',items:[
    bike(7,40,0), walk(7,40), bike(7,40,0), walk(7,40), longb(7,50,0)]},
  {n:8,block:2,note:'Megjelenik az iramváltó edzés: rövid, kicsit tempósabb szakaszok, amelyekben már csak rövid mondatokat tudsz mondani. Ha orvosod pulzushatárt adott, ott se lépd át.',items:[
    bike(8,45,0), walk(8,40), iram(8,5,4,4,2,5), walk(8,45), longb(8,55,0)]},
  {n:9,block:2,note:'Több tempós szakasz, hosszabb hosszú edzés.',items:[
    bike(9,45,0), walk(9,45), iram(9,5,5,4,2,5), walk(9,45), longb(9,60,0)]},
  {n:10,block:2,note:'Könnyebb hét, hogy a szervezet beépítse az eddigi munkát.',items:[
    bike(10,40,0), walk(10,40), iram(10,5,3,4,2,5), walk(10,40)]},
  {n:11,block:2,note:'A tempós szakaszok 3 percesek lesznek. A hosszú edzés már egy óra fölött.',items:[
    bike(11,50,0), walk(11,50), iram(11,5,5,3,3,5), walk(11,50), longb(11,65,0)]},
  {n:12,block:2,note:'Levezető hét: négy edzés, a hosszú 70 perc. A végén haladó záró mérés ugyanazon a körön.',items:[
    bike(12,50,0), walk(12,50), iram(12,5,6,3,3,5), longb(12,70,0), ref(12,'Haladó záró mérés','ref12')]}
];
var ALLITEMS=[],ALL=[];
WEEKS.forEach(function(w){w.items.forEach(function(s,i){if(!s.id)s.id='w'+w.n+'-'+(i+1);ALLITEMS.push(s);});});
var byId=function(id){for(var i=0;i<ALLITEMS.length;i++)if(ALLITEMS[i].id===id)return ALLITEMS[i];return null;};
var weekByN=function(n){for(var i=0;i<WEEKS.length;i++)if(WEEKS[i].n===n)return WEEKS[i];return null;};
var isPlan=function(s){return s.kind==='plan';};
/* edzésnapok: a hét napjai (0 = hétfő); 3-5 nap választható */
var WD=['H','K','Sze','Cs','P','Szo','V'],WDL=['hétfő','kedd','szerda','csütörtök','péntek','szombat','vasárnap'];
var WDEF={3:[0,2,5],4:[0,2,4,5],5:[0,1,3,4,5]};
function wdays(){var a=(store.wdays&&store.wdays.length>=3&&store.wdays.length<=5)?store.wdays.slice():WDEF[store.days||5].slice();return a.sort(function(x,y){return x-y;});}
var todayIdx=function(){return (new Date().getDay()+6)%7;};
/* kevesebb napnál a kulcsedzés (hosszú, iramváltó) marad, a többiből az elsők */
function activeItems(w){
  var pl=w.items.filter(isPlan),N=store.days||5;
  if(pl.length<=N)return w.items.slice();
  var keep={},cnt=0;
  pl.forEach(function(s){if(s.key&&cnt<N){keep[s.id]=1;cnt++;}});
  pl.forEach(function(s){if(!keep[s.id]&&cnt<N){keep[s.id]=1;cnt++;}});
  return w.items.filter(function(s){return s.kind==='ref'||keep[s.id];});
}
var DAYF={3:.8,4:.9,5:1};
function rebuildPlan(){
  store.days=wdays().length;
  ALL.length=0;
  WEEKS.forEach(function(w){
    var act=activeItems(w),full=w.items.filter(isPlan),ap=act.filter(isPlan);
    var T5=full.reduce(function(a,s){return a+s.min;},0),target=T5*DAYF[store.days];
    var fixed=ap.filter(function(s){return s.iram;}).reduce(function(a,s){return a+s.min;},0);
    var flex=ap.filter(function(s){return !s.iram;}).reduce(function(a,s){return a+s.min;},0);
    var sc=flex?Math.max(1,Math.min(1.4,(target-fixed)/flex)):1;
    w.items.forEach(function(it){
      if(!isPlan(it)||it.iram)return;
      var m=act.indexOf(it)>=0?Math.round(it.min*sc/5)*5:it.min;
      shape(it,Math.min(m,it.key?75:60));
    });
    w.act=act;
    if(w.block===store.block)act.forEach(function(s){ALL.push(s);});
  });
}
function blockWeeks(){return WEEKS.filter(function(w){return w.block===store.block;});}
function dayOf(it){
  if(!isPlan(it))return null;
  var w=weekByN(it.week),pl=(w.act||w.items).filter(isPlan),i=pl.indexOf(it),d=wdays();
  return d[Math.max(0,Math.min(i,d.length-1))];
}
function dayLabel(it){
  if(it.kind==='ref')return it.id==='ref0'?'Kezdéskor':'A hét végén';
  var d=dayOf(it);return d==null?'':WDL[d].charAt(0).toUpperCase()+WDL[d].slice(1);
}
rebuildPlan();
/* a terv a választott mozgásformákhoz igazodik: ami nincs, azt a legközelebbi elérhető váltja ki */
var FALLBACK={bike:['ellip','walk'],walk:['ellip','bike'],ellip:['bike','walk']};
function hasSport(k){return !!store.sports[k];}
function pickSport(base){if(hasSport(base))return base;var f=FALLBACK[base];for(var i=0;i<f.length;i++)if(hasSport(f[i]))return f[i];return base;}
function applySports(){
  ALLITEMS.forEach(function(it){
    if(it.kind!=='plan')return;
    var sp=pickSport(it.base);it.sport=sp;
    it.title=it.baseTitle==='Hosszú kör'?(sp==='bike'?'Hosszú kör':sp==='walk'?'Hosszú séta':'Hosszú elliptikus'):
      it.baseTitle==='Iramváltó'?'Iramváltó '+SPORT[sp].short.toLowerCase():SPORT[sp].name;
  });
}
function canRain(s){return hasSport('ellip')&&s&&s.kind==='plan'&&s.sport!=='ellip';}
applySports();
function routeSet(){return !!(store.route.name||store.route.km);}
function routeLabel(){var r=store.route,p=[];if(r.name)p.push(r.name);if(r.km)p.push(km(r.km));return p.join(', ');}
function refTxt(noSport){return routeSet()?'a referenciakört ('+routeLabel()+')'+(noSport?'':' '+(store.route.sport==='walk'?'gyalog':'kerékpárral'))+', kényelmes tempóban':'a választott referenciakört kényelmes tempóban';}

function describe(s){
  if(s.kind==='ref')return 'Stopperes mérés: '+refTxt()+'.';
  if(s.iram)return s.warm+' p bemelegítés · '+s.reps+' × ('+s.easy+' p '+SPORT[s.sport].mainW+' + '+s.tempo+' p tempós) · '+s.easy+' p '+SPORT[s.sport].mainW+' · '+s.cool+' p levezetés';
  var parts=[],b=s.blocks,i=0,mainW=SPORT[s.sport].mainW,easeW=SPORT[s.sport].easeW;
  while(i<b.length){
    var j=i;
    while(j+1<b.length&&b[j+1][0]===b[i][0]&&b[j+1][1]===b[i][1])j++;
    var c=j-i+1,r=b[i][0],e=b[i][1];
    parts.push(e?(c>1?c+' × (':'')+r+' p '+mainW+' + '+e+' p '+easeW+(c>1?')':''):(c>1?c+' × ':'')+r+' p '+mainW);
    i=j+1;
  }
  return s.warm+' p bemelegítés · '+parts.join(' · ')+' · '+s.cool+' p levezetés';
}
function afterReset(w,date){var r=store.resets[w];return !r||date>r;}
function isDone(s){return store.log.some(function(x){return x.sid===s.id&&x.full&&(s.kind==='ref'||afterReset(s.week,x.date));});}
function nextItem(){
  var t=dayKey(Date.now()),def=null;
  for(var i=0;i<ALL.length;i++){
    var it=ALL[i];if(isDone(it))continue;
    if(it.kind==='ref'&&store.defer[it.id]===t){if(!def)def=it;continue;}
    return it;
  }
  return def;
}
function doneSport(it){for(var i=store.log.length-1;i>=0;i--){var x=store.log[i];if(x.sid===it.id&&x.full&&(it.kind==='ref'||afterReset(it.week,x.date)))return x.sport||it.sport;}return it.sport;}
function doneCount(){return ALL.filter(isDone).length;}

/* Heti tanács: ha az előző héten sokszor elfogyott a levegő, ismétlés javasolt */
function advice(){
  var nx=nextItem();if(!nx)return null;
  var cw=nx.week,pw=cw-1;
  if(pw<1||store.dismissed[pw])return null;
  var wcw=weekByN(cw),started=wcw?wcw.act.some(isDone):true;
  if(!weekByN(pw)||weekByN(pw).block!==store.block)return null;
  if(started)return null;
  var E=store.log.filter(function(x){return x.week===pw&&x.kind==='plan'&&afterReset(pw,x.date);});
  if(!E.length)return null;
  var hard=E.filter(function(x){return x.breath==='none';}).length;
  var R=E.filter(function(x){return x.rpe;});
  var avg=R.length?R.reduce(function(a,x){return a+x.rpe;},0)/R.length:0;
  if(hard>=2||avg>=7)return {pw:pw,hard:hard,avg:avg};
  return null;
}
function last7(){
  var lim=Date.now()-7*864e5;
  return store.log.filter(function(x){return x.kind!=='str'&&new Date(x.date).getTime()>=lim;}).reduce(function(a,x){return a+(x.min||0);},0);
}
function trainedToday(){var t=dayKey(Date.now());return store.log.some(function(x){return x.kind!=='str'&&dayKey(x.date)===t;});}
function planDoneToday(){var t=dayKey(Date.now());return store.log.some(function(x){return x.kind==='plan'&&x.full&&dayKey(x.date)===t;});}
function weekQuotaMet(){var s=wkStart(Date.now());return store.log.filter(function(x){return x.kind==='plan'&&x.full&&new Date(x.date).getTime()>=s;}).length>=wdays().length;}
/* kimaradás: 8+ nap után egy, 15+ nap után két hét visszalépést javasol */
function gapInfo(){
  var L=store.log.filter(function(x){return x.kind!=='str';});if(!L.length)return null;
  var last=Math.max.apply(null,L.map(function(x){return new Date(x.date).getTime();})),days=Math.floor((Date.now()-last)/DAY),nx=nextItem();
  if(days<8||!nx||store.gapAck===dayKey(last))return null;
  var first=blockWeeks()[0].n;
  return {days:days,back:Math.min(days>=15?2:1,nx.week-first),last:dayKey(last),nx:nx};
}

/* hang, rezgés, ébren tartás */
var actx=null,wl=null;
/* iPhone: a hangot érintés oldja fel; az audioSession 'playback' módja a néma kapcsoló mellett is szólhat (újabb iOS) */
function ensureAudio(){
  try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){}
  try{
    if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}
    if(actx&&actx.state!=='running')actx.resume();
    if(actx&&!actx._unl){var b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);actx._unl=true;}
  }catch(e){}
}
document.addEventListener('touchend',ensureAudio,{passive:true});
document.addEventListener('pointerdown',ensureAudio,{passive:true});
var huVoice=null;
function pickVoice(){try{var v=speechSynthesis.getVoices();for(var i=0;i<v.length;i++)if(/^hu/i.test(v[i].lang)){huVoice=v[i];break;}}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function say(t){
  if(!store.sound||store.voice===false)return;
  try{var u=new SpeechSynthesisUtterance(t);u.lang='hu-HU';if(huVoice)u.voice=huVoice;u.rate=1;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function beep(f,d){
  if(!store.sound||!actx)return;
  try{var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='triangle';o.frequency.value=f;g.gain.value=0.0001;o.connect(g);g.connect(actx.destination);
    g.gain.exponentialRampToValueAtTime(0.8,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d+0.03);}catch(e){}
}
function vib(p){try{if(store.sound&&navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function cue(t){
  if(t==='main'||t==='tempo'){beep(880,.15);setTimeout(function(){beep(1100,.22);},190);vib([150,80,150]);}
  else if(t==='ease'){beep(520,.35);vib(300);}
  else{beep(660,.22);vib(200);}
}
function fanfare(){beep(784,.15);setTimeout(function(){beep(988,.15);},200);setTimeout(function(){beep(1175,.35);},400);vib([200,100,200,100,300]);}
function lock(){try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}catch(e){}}
function unlock(){try{if(wl){wl.release();wl=null;}}catch(e){}}

/* kétlépéses megerősítés */
var conf=null,confT=0;
function refreshArmed(){
  var els=document.querySelectorAll('[data-key]');
  for(var i=0;i<els.length;i++){var el=els[i],l=el.querySelector('.lbl');if(l)l.textContent=(el.getAttribute('data-key')===conf)?'Biztosan?':el.getAttribute('data-label');}
}
function arm(key,fn){
  if(conf===key){conf=null;clearTimeout(confT);fn();return;}
  conf=key;clearTimeout(confT);confT=setTimeout(function(){conf=null;refreshArmed();},4000);refreshArmed();
}

/* nyitókép: a 6 hét kanyargó útvonalként */
function routeSvg(nx){
  var N=ALL.length,per=8,rows=Math.ceil(N/per),x0=30,x1=310,dy=46,y0=36,W=340,H=y0+(rows-1)*dy+30;
  var pts=ALL.map(function(s,i){var r=Math.floor(i/per),c=i%per,f=c/(per-1);return {x:r%2?x1-f*(x1-x0):x0+f*(x1-x0),y:y0+r*dy,r:r};});
  function pathTo(k){
    var d='M'+pts[0].x+' '+pts[0].y;
    for(var i=1;i<=k&&i<N;i++){
      var a=pts[i-1],b=pts[i];
      if(b.r!==a.r)d+=' A'+(dy/2)+' '+(dy/2)+' 0 0 '+(a.r%2?0:1)+' '+b.x+' '+b.y;else d+=' L'+b.x.toFixed(1)+' '+b.y;
    }
    return d;
  }
  var nIdx=nx?ALL.indexOf(nx):N-1,s='<svg class="route" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+doneCount()+' állomás kész a '+N+'-ből">';
  s+='<path class="rail" d="'+pathTo(N-1)+'"/>';
  if(nIdx>0)s+='<path class="trav" d="'+pathTo(nIdx)+'"/>';
  var seen={};
  ALL.forEach(function(it,i){
    var p=pts[i],done=isDone(it),sp=done?doneSport(it):it.sport,col=it.kind==='ref'?'var(--n-ref)':('var(--n-'+sp+')');
    if(!seen[it.week]){seen[it.week]=1;s+='<text class="wl" x="'+p.x+'" y="'+(p.y-14)+'" text-anchor="'+(p.r%2?'end':'start')+'">'+(it.week-(store.block-1)*6)+'. HÉT</text>';}
    if(it.kind==='ref')s+='<rect x="'+(p.x-5.5)+'" y="'+(p.y-5.5)+'" width="11" height="11" rx="2" transform="rotate(45 '+p.x+' '+p.y+')" fill="'+(done?col:'var(--night)')+'" stroke="'+col+'" stroke-width="2"/>';
    else s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(done?5.5:4.5)+'" fill="'+(done?col:'var(--night)')+'" stroke="'+col+'" stroke-width="2"/>';
    if(nx&&it.id===nx.id)s+='<circle class="nx" cx="'+p.x+'" cy="'+p.y+'" r="10"/>';
  });
  return s+'</svg>';
}

function tick(){
  if(run.mode==='run')tickRun();
  else if(run.mode==='watch'){var sec=Math.floor(elapsedMs()/1000),b=$('big');if(b)b.textContent=mmss(sec);setDial((sec%60)/60);}
}
function tickRun(){
  var e=elapsedMs()/1000;
  if(e>=run.total){finishRun(true);return;}
  var idx=0;while(e>=run.cum[idx])idx++;
  if(idx!==run.idx){var first=run.idx<0;run.idx=idx;setPhaseUI(idx);if(!first||e<1){var ph=run.session.phases[idx];cue(ph.t);setTimeout(function(){say(phName(ph.t,run.session.sport)+', '+Math.round(ph.s/60)+' perc');},650);}run.lastSec=-1;}
  var sl=Math.ceil(run.cum[idx]-e);
  if(sl!==run.lastSec){run.lastSec=sl;if(sl>=1&&sl<=3)beep(700,.08);}
  $('big').textContent=mmss(sl);
  var ps=idx?run.cum[idx-1]:0;setDial((e-ps)/(run.cum[idx]-ps));
  $('totRem').textContent=mmss(Math.ceil(run.total-e));
  for(var i=0;i<run.fills.length;i++){
    var s0=i?run.cum[i-1]:0,f=Math.min(1,Math.max(0,(e-s0)/(run.cum[i]-s0)));
    run.fills[i].style.width=(f*100).toFixed(1)+'%';
  }
}
function setupSession(s){
  var c=0;run.session=s;run.sport=s.sport;run.cum=[];
  s.phases.forEach(function(p){c+=p.s;run.cum.push(c);});run.total=c;
}
function go(){clearInterval(run.timer);run.timer=setInterval(tick,250);tick();}
function startRun(){

  ensureAudio();say('Indul az edzés');lock();setupSession(s);
  run.kind='plan';run.base=0;run.resumeAt=Date.now();run.paused=false;run.idx=-1;run.lastSec=-1;run.mode='run';
  persist();renderRun();go();
}
function startWatch(kind,sport,s){

}

function restore(){
  var a=store.active;if(!a)return;
  run.base=a.base||0;run.resumeAt=a.resumeAt||Date.now();run.paused=!!a.paused;
  var e=elapsedMs()/1000;
  if(a.mode==='run'){
    var s=byId(a.sid);
    if(!s||s.kind!=='plan'||e>s.total+3600){store.active=null;save();return;}
    if(a.sport&&a.sport!==s.sport)s=swapAs(s,a.sport);
    setupSession(s);run.kind='plan';run.mode='run';run.idx=-1;run.lastSec=-1;
  }else if(a.mode==='watch'){
    if(e>6*3600){store.active=null;save();return;}
    run.kind=a.kind;run.sport=a.sport||'bike';run.session=a.sid?byId(a.sid):null;run.mode='watch';
    if(run.kind==='ref'&&!run.session){store.active=null;save();run.mode='idle';return;}
  }else return;
  renderRun();setTab('run');lock();go();
}

/* ---------- Napló: Elemzés / Bejegyzések / Rögzítés ---------- */
var logView='insights',addView='workout';
var DAY=864e5;
function wkStart(t){var d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
function addDays(t,n){var d=new Date(t);d.setDate(d.getDate()+n);return d.getTime();}
function weekBuckets(n){
  var s0=wkStart(Date.now()),out=[];
  for(var i=n-1;i>=0;i--){
    var st=addDays(s0,-7*i),en=addDays(st,7);
    var E=store.log.filter(function(x){var t=new Date(x.date).getTime();return x.kind!=='str'&&t>=st&&t<en;});
    out.push({start:st,end:en,min:E.reduce(function(a,x){return a+(x.min||0);},0),count:E.length});
  }
  return out;
}
function fmtWeek(st){var a=new Date(st),b=new Date(addDays(st,6));
  var o={month:'short',day:'numeric'};try{return a.toLocaleDateString('hu-HU',o)+' – '+b.toLocaleDateString('hu-HU',o);}catch(e){return dayKey(st);}}
function avgOf(a){return a.length?a.reduce(function(s,v){return s+v;},0)/a.length:0;}
function trendOf(pts){ /* heti meredekség lineáris regresszióval */
  var p=pts.slice().sort(function(a,b){return a.d<b.d?-1:1;});
  if(p.length<2)return null;
  var t0=new Date(p[0].d).getTime(),xs=p.map(function(o){return (new Date(o.d).getTime()-t0)/(7*DAY);}),ys=p.map(function(o){return o.v;});
  var mx=avgOf(xs),my=avgOf(ys),num=0,den=0;
  for(var i=0;i<xs.length;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)*(xs[i]-mx);}
  return {s:den?num/den:0,first:ys[0],last:ys[ys.length-1],n:p.length,weeks:xs[xs.length-1]};
}
var nf1=function(v){return dec((Math.round(v*10)/10).toFixed(1));};
function analyze(){
  var L=store.log,M=store.metrics,now=Date.now(),I=[];
  function add(tone,title,text,dir){I.push({tone:tone,title:title,text:text,dir:dir||(tone==='good'?'up':tone==='warn'?'alert':'flat')});}
  var wk=weekBuckets(8),cur=wk[7],prev=wk[6];
  var firstT=L.length?Math.min.apply(null,L.map(function(x){return new Date(x.date).getTime();})):now;
  var fullW=wk.slice(0,7).filter(function(w){return w.end>firstT;});
  if(L.length){
    var t='Ezen a héten eddig '+Math.round(cur.min)+' perc'+(fullW.length?', múlt héten '+Math.round(prev.min)+' perc':'')+'. A cél heti 150 perc.';
    if(fullW.length&&prev.min>=150)add('good','Heti mozgás',t+' Múlt héten megvolt a cél.');
    else if(fullW.length>=2&&prev.min>wk[5].min)add('good','Heti mozgás',t+' Nő a heti mozgásidő.');
    else add('neutral','Heti mozgás',t);
    var days={};L.forEach(function(x){if(now-new Date(x.date).getTime()<14*DAY)days[dayKey(x.date)]=1;});
    var nd=Object.keys(days).length;
    if(nd>=6)add('good','Rendszeresség','Az elmúlt 14 napból '+nd+' napon mozogtál. Ez az állóképesség legfontosabb hajtóereje.');
    else if(now-firstT>7*DAY&&nd<=2)add('warn','Rendszeresség','Az elmúlt 14 napból csak '+nd+' napon mozogtál. Rövidebb, de gyakoribb edzés többet ér.');
    else add('neutral','Rendszeresség','Az elmúlt 14 napból '+nd+' napon mozogtál. Heti 4-5 alkalom a cél.');
  }
  var B=L.filter(function(x){return x.breath;}),Rb=B.filter(function(x){return now-new Date(x.date).getTime()<14*DAY;}),Ob=B.filter(function(x){return now-new Date(x.date).getTime()>=14*DAY;});
  var none7=B.filter(function(x){return x.breath==='none'&&now-new Date(x.date).getTime()<7*DAY;}).length;
  if(none7>=2)add('warn','Beszélgetős teszt','Az elmúlt héten '+none7+' edzésen alig tudtál beszélni. Lassíts, vagy tarts hosszabb pihenőt a szakaszok között.');
  else if(Rb.length>=3){
    var pf=function(a){return Math.round(a.filter(function(x){return x.breath==='full';}).length/a.length*100);};
    var p=pf(Rb),q=Ob.length>=3?pf(Ob):null;
    var t2='Az utóbbi két hétben az edzések '+p+'%-ában végig tudtál beszélni'+(q!==null?' (korábban '+q+'%)':'')+'.';
    if(q!==null&&p>=q+10)add('good','Beszélgetős teszt',t2+' Egyre könnyebben megy ugyanaz a terhelés.');
    else if(p>=70)add('good','Beszélgetős teszt',t2+' Jó tempót tartasz.');
    else add('neutral','Beszélgetős teszt',t2+' A cél, hogy a legtöbb edzésen végig tudj beszélni.');
  }
  var P=L.filter(function(x){return x.kind==='plan'&&x.rpe;});
  if(P.length>=4){
    var h2=Math.min(4,Math.floor(P.length/2)),A=P.slice(-h2),Bq=P.slice(-2*h2,-h2);
    var rA=avgOf(A.map(function(x){return x.rpe;})),rB=avgOf(Bq.map(function(x){return x.rpe;})),mA=avgOf(A.map(function(x){return x.min;})),mB=avgOf(Bq.map(function(x){return x.min;}));
    var t3='Az utolsó '+h2+' edzés átlaga '+Math.round(mA)+' perc, '+nf1(rA)+' megterheléssel (előtte '+Math.round(mB)+' perc, '+nf1(rB)+').';
    if(rA>=7)add('warn','Megterhelés',t3+' Ez soknak tűnik: ebben a programban a 3-5 a cél.');
    else if(mA>mB&&rA<=rB+0.3)add('good','Megterhelés',t3+' Hosszabb edzések, nem nagyobb megterheléssel: ez a fejlődés jele.');
    else add('neutral','Megterhelés',t3);
  }
  var pick=function(arr,f){return arr.filter(function(x){return x[f];}).map(function(x){return {d:x.date,v:x[f]};});};
  var tr=trendOf(pick(M,'rhr'));
  if(tr&&tr.n>=3){
    var t4=tr.first+' → '+tr.last+' ütés/perc, hetente átlag '+(tr.s>0?'+':'')+nf1(tr.s)+'.';
    if(tr.s<=-0.3)add('good','Nyugalmi pulzus',t4+' A csökkenő nyugalmi pulzus az edzettség javulását jelzi.','down');
    else if(tr.s>=0.5)add('warn','Nyugalmi pulzus',t4+' Emelkedik. Kevés alvás, stressz vagy betegség is okozhatja; ha tartós, kérdezd meg az orvosod.','up');
    else add('neutral','Nyugalmi pulzus',t4+' Egyelőre stabil.');

  var h='<div class="trend"><div class="row"><span class="lbl-t">'+d.t+'</span><span class="tv"><b>'+fmtV(d,last.v)+'</b>'+(d.u?' <span class="muted small">'+d.u+'</span>':'')+'</span></div>';
  if(p.length<2)return h+'<p class="hint">Egy mérés van. A második után itt megjelenik a trend.</p></div>';
  var delta=last.v-first.v,good=d.better==='lower'?delta<0:delta>0;
  var dtxt=Math.abs(delta)<1e-9?'Nem változott az első méréshez képest.':
    (delta>0?'+':'-')+fmtV(d,Math.abs(delta))+(d.u?' '+d.u:'')+' az első méréshez képest'+(d.neutral?'.':', '+(good?'kedvező irány.':'egyelőre nem kedvező irány.'));
  var W=320,H=132,L=40,R=12,T=12,B=24,pw=W-L-R,ph=H-T-B;
  var ts=p.map(function(o){return new Date(o.d).getTime();}),t0=ts[0],t1=ts[ts.length-1];
  var vs=p.map(function(o){return o.v;}),vmin=Math.min.apply(null,vs),vmax=Math.max.apply(null,vs);
  var span=vmax-vmin||Math.max(1,Math.abs(vmax)*0.05),lo=vmin-span*0.15,hi=vmax+span*0.15;
  var xs=p.map(function(o,i){return L+(t1>t0?(ts[i]-t0)/(t1-t0):(p.length>1?i/(p.length-1):.5))*pw;});
  var ys=p.map(function(o){return T+(1-(o.v-lo)/(hi-lo))*ph;});
  var yMax=T+(1-(vmax-lo)/(hi-lo))*ph,yMin=T+(1-(vmin-lo)/(hi-lo))*ph;
  CH[d.k]={d:d,p:p,xs:xs,ys:ys};
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(d.t)+': '+fmtV(d,first.v)+'-ról '+fmtV(d,last.v)+'-ra">';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yMax.toFixed(1)+'" y2="'+yMax.toFixed(1)+'" class="gl"/>';
  if(vmax!==vmin)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yMin.toFixed(1)+'" y2="'+yMin.toFixed(1)+'" class="gl"/>';
  s+='<text x="'+(L-6)+'" y="'+(yMax+4).toFixed(1)+'" text-anchor="end" class="ax">'+fmtV(d,vmax)+'</text>';
  if(vmax!==vmin)s+='<text x="'+(L-6)+'" y="'+(yMin+4).toFixed(1)+'" text-anchor="end" class="ax">'+fmtV(d,vmin)+'</text>';
  s+='<text x="'+L+'" y="'+(H-6)+'" text-anchor="start" class="ax">'+esc(fmtDay(first.d))+'</text>';
  s+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" class="ax">'+esc(fmtDay(last.d))+'</text>';
  s+='<polyline class="ln" points="'+xs.map(function(x,i){return x.toFixed(1)+','+ys[i].toFixed(1);}).join(' ')+'"/>';
  xs.forEach(function(x,i){var e=i===xs.length-1;s+='<circle class="pt" cx="'+x.toFixed(1)+'" cy="'+ys[i].toFixed(1)+'" r="'+(e?5.5:4)+'"/>';});
  s+='<circle class="hl" id="hl-'+d.k+'" cx="0" cy="0" r="8" visibility="hidden"/>';
  s+='<rect class="hit" data-k="'+d.k+'" x="'+(L-10)+'" y="0" width="'+(pw+20)+'" height="'+H+'" fill="transparent"/></svg>';
  return h+'<p class="hint">'+dtxt+'</p>'+s+'<p class="hint cap" id="cap-'+d.k+'">Érintsd meg a grafikont az egyes értékekért.</p></div>';
}
function trendsCard(){
  var M=store.metrics,L=store.log;CH={};
  var pick=function(arr,f){return arr.filter(function(x){return x[f];}).map(function(x){return {d:x.date,v:x[f]};});};
  var defs=[
    {k:'wt',t:'Testsúly',u:'kg',dec:1,neutral:true,pts:pick(M,'wt')},
    {k:'rhr',t:'Nyugalmi pulzus',u:'ütés/perc',better:'lower',pts:pick(M,'rhr')},
    {k:'vo2',t:'Kardiófitnesz (VO2max)',u:'ml/kg/perc',better:'higher',dec:1,pts:pick(M,'vo2')},
    {k:'walk',t:'Séta-pulzus átlaga',u:'ütés/perc',better:'lower',pts:pick(M,'walkHr')},
    {k:'reft',t:'Referenciakör ideje',u:'',better:'lower',time:1,pts:pick(L.filter(function(x){return x.kind==='ref';}),'sec')},
    {k:'refhr',t:'Referenciakör átlagpulzusa',u:'ütés/perc',better:'lower',pts:pick(L.filter(function(x){return x.kind==='ref';}),'hrAvg')},
    {k:'rec',t:'Pulzusesés 1 perc alatt',u:'ütés/perc',better:'higher',pts:pick(L,'hrRec')}
  ].filter(function(d){return d.pts.length;});
  if(!defs.length)return '<div class="card"><div class="eyebrow">Trendek</div><p class="muted small">A heti mérőszámokból és a mérésekből itt rajzolódik ki a fejlődés: testsúly, nyugalmi pulzus, a referenciakör ideje, okosórával a VO2max, a séta-pulzus és a pulzusesés edzés után is.</p></div>';
  return '<div class="card"><div class="eyebrow">Trendek</div><div class="trends">'+defs.map(chartBlock).join('')+'</div></div>';
}
function onChart(ev){
  var r=ev.target;if(!r||!r.classList||!r.classList.contains('hit'))return;
  var k=r.getAttribute('data-k'),c=CH[k];if(!c)return;
  var b=r.ownerSVGElement.getBoundingClientRect(),x=(ev.clientX-b.left)/b.width*320,bi=0;
  for(var i=1;i<c.xs.length;i++)if(Math.abs(c.xs[i]-x)<Math.abs(c.xs[bi]-x))bi=i;
  var hl=$('hl-'+k);if(hl){hl.setAttribute('cx',c.xs[bi].toFixed(1));hl.setAttribute('cy',c.ys[bi].toFixed(1));hl.setAttribute('visibility','visible');}
  var cap=$('cap-'+k);if(cap)cap.textContent=fmtDay(c.p[bi].d)+': '+fmtV(c.d,c.p[bi].v)+(c.d.u?' '+c.d.u:'');
}
document.addEventListener('pointermove',onChart);
document.addEventListener('pointerdown',onChart);

function saveManual(){
  var m=numIn('mMin',0,600)||0,s=numIn('mSec',0,59)||0,sec=m*60+s,msg=$('mMsg');
  if(sec<60){msg.textContent='Adj meg legalább 1 percet.';return;}
  var dv=$('mDate').value,d=dv?new Date(dv+'T12:00:00'):new Date();
  if(isNaN(d.getTime()))d=new Date();
  if(dv===dayKey(Date.now()))d=new Date();
  var isRef=$('mRef').checked,rItem=null;
  if(isRef){for(var i=0;i<ALL.length;i++){if(ALL[i].kind==='ref'&&!isDone(ALL[i])){rItem=ALL[i];break;}}}
  var np=(!isRef&&manualLink==='plan')?nextPlanItem():null;
  if(np&&np.kind==='ref'){isRef=true;rItem=np;np=null;}
  var e={id:Date.now(),date:d.toISOString(),kind:isRef?'ref':(np?'plan':'manual'),sport:isRef?(routeSet()?store.route.sport:manualSport):manualSport,
    sid:rItem?rItem.id:(np?np.id:null),week:rItem?rItem.week:(np?np.week:null),planned:np?np.total/60:null,
    title:isRef?(rItem?rItem.title:'Referenciakör')+(routeSet()?' · '+routeLabel():''):(np?planTitle(np,manualSport):SPORT[manualSport].name+' (utólag)'),min:Math.round(sec/60),sec:sec,full:true,
    rpe:null,breath:manualBreath||null,hrAvg:numIn('mHrAvg',30,230),hrMax:numIn('mHrMax',30,230),hrRec:numIn('mHrRec',1,100),km:isRef?(store.route.km||numIn('mKm',0.01,300,true)):numIn('mKm',0.01,300,true),note:$('mNote').value.trim().slice(0,300)};
  store.log.push(e);store.log.sort(function(a,b){return a.date<b.date?-1:1;});manualBreath='';manualLink='plan';
  if(run.mode==='idle'){run.rain=false;run.sel=nextItem();}logView='list';save();renderAll();window.scrollTo(0,0);
}
function copyText(txt,msgId,taId){
  var ok=function(){$(msgId).textContent='Vágólapra másolva.';};
  var fb=function(){var ta=$(taId);ta.hidden=false;ta.readOnly=true;ta.value=txt;ta.focus();ta.select();$(msgId).textContent='Jelöld ki és másold ki a szöveget.';};
  try{navigator.clipboard.writeText(txt).then(ok,fb);}catch(e){fb();}
}
function doImport(){
  var msg=$('bkMsg');
  try{
    var o=JSON.parse($('bkText').value);
    if(!o||!Array.isArray(o.log))throw new Error('x');
    store.log=o.log;store.metrics=Array.isArray(o.metrics)?o.metrics:[];if(o.route)store.route=o.route;if(o.sports)store.sports=o.sports;store.onboarded=true;store.days=[3,4,5].indexOf(o.days)>=0?o.days:5;store.block=o.block===2?2:1;store.wdays=Array.isArray(o.wdays)?o.wdays:null;applySports();rebuildPlan();store.hrCap=o.hrCap||null;store.resets=o.resets||{};store.dismissed=o.dismissed||{};store.active=null;
    save();renderAll();$('bkMsg').textContent='Visszaállítva: '+store.log.length+' bejegyzés.';
  }catch(e){msg.textContent='Ez nem érvényes mentés. Másold be a teljes szöveget, amit a "Biztonsági mentés másolása" adott.';}
}

function renderAll(){renderPlan();if(run.mode==='idle')renderRun();renderLog();renderSettings();}

/* ================= események ================= */
document.addEventListener('click',function(ev){
  var t=ev.target.closest?ev.target.closest('[data-act]'):null;if(!t)return;
  var a=t.getAttribute('data-act');
  switch(a){
    case 'tab':setTab(t.getAttribute('data-tab'));break;
    case 'pick':if(run.mode==='idle'){run.sel=byId(t.getAttribute('data-sid'));run.rain=false;renderRun();}setTab('run');break;
    case 'start':startRun();break;
    case 'rain':run.rain=t.getAttribute('data-v')==='1';renderRun();break;
    case 'rainpick':if(run.mode==='idle'){run.sel=byId(t.getAttribute('data-sid'));run.rain=true;renderRun();}setTab('run');break;
    case 'defer':store.defer[t.getAttribute('data-sid')]=dayKey(Date.now());save();if(run.mode==='idle'){run.rain=false;run.sel=nextItem();}renderAll();renderRun();setTab('run');break;
    case 'refstart':
      if($('rName')){
        var rn=$('rName').value.trim().slice(0,60),rk=numIn('rKm',0.1,100,true);
        if(rn||rk)store.route={name:rn,km:rk?Math.round(rk*100)/100:null,sport:routeSport};
      }
      store.route.sport=routeSport;save();
      startWatch('ref',routeSport,byId(t.getAttribute('data-sid')));break;
    case 'rsport':
      routeSport=t.getAttribute('data-v');
      [].forEach.call(document.querySelectorAll('#rSport .opt'),function(b){b.classList.toggle('on',b===t);});break;
    case 'free':startWatch('free',t.getAttribute('data-sport'),null);break;
    case 'pause':togglePause();break;
    case 'skip':skipPhase();break;
    case 'stop':arm('stop',function(){finishRun(false);});break;
    case 'watchdone':finishWatch();break;
    case 'cancel':arm('cancel',resetRun);break;
    case 'rpe':
      run.rpe=parseInt(t.getAttribute('data-v'),10);
      [].forEach.call(document.querySelectorAll('#rpe button'),function(b){b.classList.toggle('on',b===t);});break;
    case 'breath':
      run.breath=t.getAttribute('data-v');
      [].forEach.call(document.querySelectorAll('#breath .opt'),function(b){b.classList.toggle('on',b===t);});
      $('breathHint').textContent={full:'Pontosan ez a cél.',short:'Még rendben, de legközelebb lassíts egy kicsit.',none:'Legközelebb menj lassabban, vagy tarts hosszabb pihenőt. Ha mellkasi szorítást vagy szédülést éreztél, szólj az orvosodnak.'}[run.breath]||'';break;
    case 'savefb':saveFeedback();break;
    case 'dropfb':arm('dropfb',resetRun);break;
    case 'del':
      var id=parseInt(t.getAttribute('data-id'),10);
      arm('del'+id,function(){store.log=store.log.filter(function(x){return x.id!==id;});save();if(run.mode==='idle')run.sel=nextItem();renderAll();});break;
    case 'repeat':
      var w=t.getAttribute('data-w');store.resets[w]=new Date().toISOString();delete store.dismissed[w];save();run.sel=nextItem();renderAll();break;
    case 'dismiss':store.dismissed[t.getAttribute('data-w')]=true;save();renderPlan();break;
    case 'msport':
      manualSport=t.getAttribute('data-v');
      [].forEach.call(document.querySelectorAll('#mSport .opt'),function(b){b.classList.toggle('on',b===t);});break;
    case 'msave':saveManual();break;
    case 'sporttog':
      var sk=t.getAttribute('data-v');
      if(store.sports[sk]&&['bike','walk','ellip'].filter(hasSport).length===1){var sm=$('spMsg');if(sm)sm.textContent='Legalább egy mozgásforma kell.';break;}
      store.sports[sk]=!store.sports[sk];applySports();save();
      if(run.mode==='idle'){run.rain=false;run.sel=nextItem();}renderAll();break;
    case 'onboard':store.onboarded=true;save();renderAll();break;
    case 'wday':
      var di=parseInt(t.getAttribute('data-v'),10),cur=wdays(),pos=cur.indexOf(di),wm=$('wdMsg');
      if(pos>=0&&cur.length<=3){if(wm)wm.textContent='Legalább 3 edzésnap kell.';break;}
      if(pos<0&&cur.length>=5){if(wm)wm.textContent='Legfeljebb 5 edzésnap. Előbb vegyél ki egyet.';break;}
      if(pos>=0)cur.splice(pos,1);else cur.push(di);
      store.wdays=cur.sort(function(a,b){return a-b;});rebuildPlan();save();if(run.mode==='idle'){run.rain=false;run.sel=nextItem();}renderAll();break;
    case 'force':run.force=!run.force;renderRun();break;
    case 'gapback':
      var gi=gapInfo();if(gi){var nowIso=new Date().toISOString();for(var gw=gi.nx.week-gi.back;gw<=gi.nx.week;gw++)store.resets[gw]=nowIso;store.gapAck=gi.last;}
      save();if(run.mode==='idle'){run.rain=false;run.sel=nextItem();}renderAll();window.scrollTo(0,0);break;
    case 'gapok':var gk=gapInfo();if(gk)store.gapAck=gk.last;save();renderPlan();break;
    case 'strdone':
      store.log.push({id:Date.now(),date:new Date().toISOString(),kind:'str',sport:'str',title:'Erősítés és nyújtás',min:15,sec:900,full:true,note:''});
      save();renderAll();break;
    case 'setblock':store.block=parseInt(t.getAttribute('data-v'),10)===2?2:1;rebuildPlan();save();if(run.mode==='idle'){run.rain=false;run.sel=nextItem();}renderAll();setTab('plan');window.scrollTo(0,0);break;
    case 'sumper':sumPeriod=t.getAttribute('data-v');renderLog();var sc=$('summary');if(sc)sc.scrollIntoView({block:'start'});break;
    case 'copysum':copyText(summaryText(sumPeriod),'sumMsg','sumText');break;
    case 'wipe':arm('wipe',function(){
      store.log=[];store.metrics=[];store.defer={};store.route={name:'',km:null,sport:'bike'};store.hrCap=null;store.resets={};store.dismissed={};store.active=null;
      store.sports={bike:true,walk:true,ellip:true};store.onboarded=false;store.days=5;store.wdays=null;store.gapAck=null;store.block=1;applySports();rebuildPlan();save();resetRun();renderAll();setTab('plan');window.scrollTo(0,0);});break;
    case 'mlink':manualLink=t.getAttribute('data-v');[].forEach.call(document.querySelectorAll('#mLink .opt'),function(b){b.classList.toggle('on',b===t);});break;
    case 'mbreath':manualBreath=manualBreath===t.getAttribute('data-v')?'':t.getAttribute('data-v');[].forEach.call(document.querySelectorAll('#mBreath .opt'),function(b){b.classList.toggle('on',b.getAttribute('data-v')===manualBreath);});break;
    case 'attach':
      var aid=parseInt(t.getAttribute('data-id'),10),np2=nextPlanItem();
      store.log.forEach(function(x){if(x.id===aid&&np2){x.kind=np2.kind==='ref'?'ref':'plan';x.sid=np2.id;x.week=np2.week;x.planned=np2.kind==='ref'?null:np2.total/60;x.full=true;x.title=planTitle(np2,x.sport||'bike');if(np2.kind==='ref'&&!x.km&&store.route.km)x.km=store.route.km;}});
      if(run.mode==='idle'){run.rain=false;run.sel=nextItem();}save();renderAll();break;
    case 'metsave':saveMetrics();break;
    case 'metdel':
      var mid=parseInt(t.getAttribute('data-id'),10);
      arm('m'+mid,function(){store.metrics=store.metrics.filter(function(m){return m.id!==mid;});save();renderAll();});break;
    case 'gometrics':logView='add';addView='metrics';renderLog();setTab('log');window.scrollTo(0,0);break;
    case 'logview':logView=t.getAttribute('data-v');renderLog();window.scrollTo(0,0);break;
    case 'addview':addView=t.getAttribute('data-v');renderLog();break;
    case 'copylog':copyText(logText(),'copyMsg','logText');break;
    case 'export':
      var o={v:2,log:store.log,metrics:store.metrics,route:store.route,sports:store.sports,days:store.days,wdays:store.wdays,block:store.block,hrCap:store.hrCap,resets:store.resets,dismissed:store.dismissed};
      copyText(JSON.stringify(o),'bkMsg','bkText');break;
    case 'showimport':
      var ta=$('bkText');ta.hidden=false;ta.readOnly=false;ta.value='';ta.placeholder='Illeszd be ide a mentést';ta.focus();$('bkLoad').hidden=false;
      $('bkMsg').textContent='A betöltés felülírja a mostani naplót.';break;
    case 'import':arm('import',doImport);break;
    /* hang ki/be: a Beállítások fülön */
    case 'sndtest':ensureAudio();if(!store.sound){store.sound=true;save();renderSound();}cue('main');setTimeout(function(){say('Hangpróba. Ha ezt hallod, minden rendben.');},500);break;
  }
});
document.addEventListener('change',function(ev){
  if(ev.target&&ev.target.id==='voiceOn'){store.voice=ev.target.checked;if(store.voice&&!store.sound)store.sound=true;save();renderSettings();return;}
  if(ev.target&&ev.target.id==='sndOn'){store.sound=ev.target.checked;save();ensureAudio();renderSettings();return;}
  if(ev.target&&ev.target.id==='hrCap'){store.hrCap=numIn('hrCap',80,200);save();renderLog();}
});

/* ================= indulás ================= */
run.sel=nextItem();
renderAll();renderRun();setTab('plan');
restore();
})();
</script>
